<style id="appStyle">
/* Layout: scorebook-style tool. Sticky tab bar, one working panel per step (Setup, Schedule, Fairness, Rainouts), plus Coaches Corner and Umpire Corner. */
:root{

.step{font-family:var(--body);font-size:11px;font-weight:700;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
button[aria-selected="true"] .step{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

.sharecard{border-color:var(--accent)}

.pc0{background:var(--pc0)}.pc1{background:var(--pc1)}.pc2{background:var(--pc2)}.pc3{background:var(--pc3)}.pc4{background:var(--pc4)}.pc5{background:var(--pc5)}
.pc6{background:var(--pc6)}.pc7{background:var(--pc7)}.pc8{background:var(--pc8)}.pc9{background:var(--pc9)}.pc10{background:var(--pc10)}.pc11{background:var(--pc11)}

select.cell.dbl{outline:2px solid var(--bad);outline-offset:-2px}
table.chk2 td.c-dbl{background:var(--bad-soft);color:var(--bad);font-weight:700}

<script id="appScript">
// ===== Scheduling core (no DOM) =====
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYMS = 86400000;
function parseD(s){const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d);}
function fmtD(t){return new Date(t).toISOString().slice(0,10);}
function dowOf(s){return new Date(parseD(s)).getUTCDay();}
function dayNum(s){return Math.round(parseD(s)/DAYMS);}
function weekKey(s){const n=dayNum(s);const dow=(dowOf(s)+6)%7;return n-dow;} // Monday-based
function addDays(s,k){return fmtD(parseD(s)+k*DAYMS);}
function fmtTime(m){let h=Math.floor(m/60),mi=m%60,ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(mi).padStart(2,'0')+' '+ap;}
function parseTime(s){const m=String(s).trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/i);if(!m)return null;let h=+m[1],mi=+(m[2]||0);const ap=(m[3]||'').toLowerCase();if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;if(!ap&&h<9)h+=12;return h*60+mi;}
function fmtDateLong(s){const d=new Date(parseD(s));return DOW[d.getUTCDay()]+' '+d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});}

function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};}

function buildSlots(cfg){
  const slots=[];const black=new Set(cfg.blackouts);
  for(let t=parseD(cfg.start);t<=parseD(cfg.end);t+=DAYMS){
    const date=fmtD(t);if(black.has(date))continue;const dow=new Date(t).getUTCDay();
    if(cfg.dayTimes[dow]===undefined)continue;
    const set=new Set(cfg.dayTimes[dow]);if(dow>=1&&dow<=5)for(const dv of cfg.divisions)for(const x of (dv.ownTimes||[]))set.add(x);
    const times=[...set].sort((a,b)=>a-b);if(!times.length)continue;
    const makeup=cfg.makeupDays.includes(dow);
    for(const time of times)for(const f of cfg.fields)slots.push({id:date+'|'+time+'|'+f.id,date,dow,time,field:f.id,makeup});
  }
  return slots;
}
function divLen(cfg,div){return (div&&div.gameLength)||cfg.gameLength;}
function divTimesFor(cfg,div,dow){return (dow>=1&&dow<=5&&div.ownTimes&&div.ownTimes.length)?div.ownTimes:(cfg.dayTimes[dow]||[]);}
function gLen(cfg,g){return g.len||divLen(cfg,cfg.divisions.find(d=>d.id===g.div));}
function overlaps(t1,l1,t2,l2){return t1<t2+l2&&t2<t1+l1;}
function fieldFree(cfg,idx,field,date,time,len){for(const g of (idx.byFieldDate[field+'|'+date]||[]))if(overlaps(time,len,g.time,gLen(cfg,g)))return false;return true;}
function divAllowsSlot(cfg,div,slot,repair){
  const f=cfg.fields.find(x=>x.id===slot.field);if(!f||!f.divisions.includes(div.id))return false;
  if(!divTimesFor(cfg,div,slot.dow).includes(slot.time))return false;
  if(slot.time>div.latest)return false;
  if(slot.makeup)return !!repair;
  if(!repair&&!div.days.includes(slot.dow))return false;
  return true;
}
function roundRobin(teams,gamesPerTeam){
  const list=teams.slice();if(list.length%2)list.push(null);
  const n=list.length,rounds=[];
  let arr=list.slice();
  for(let r=0;r<n-1;r++){const pairs=[];for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];if(a&&b)pairs.push(r%2?[b,a]:[a,b]);}rounds.push(pairs);arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];}
  const games=[];const count={};teams.forEach(t=>count[t]=0);let cycle=0,ri=0;
  const target=teams.length*gamesPerTeam/2;
  while(games.length<target&&cycle<50){
    for(const [a,b] of rounds[ri]){if(games.length>=target)break;if(count[a]>=gamesPerTeam||count[b]>=gamesPerTeam)continue;const p=cycle%2?[b,a]:[a,b];games.push({home:p[0],away:p[1],round:cycle*(n-1)+ri});count[a]++;count[b]++;}
    ri++;if(ri>=rounds.length){ri=0;cycle++;}
  }
  return games;
}
function conflictsFor(cfg,team){const out=new Set();for(const c of cfg.conflicts){const ts=c.teams||[c.a,c.b];if(ts.includes(team))ts.forEach(x=>{if(x&&x!==team)out.add(x);});}return [...out];}

// index helpers over a schedule
function makeIndex(cfg,games){
  const idx={byTeamDate:{},bySlot:{},byTeam:{},byFieldDate:{}};
  for(const g of games){if(!g.date)continue;addToIndex(idx,g);}
  return idx;
}
function teamCanPlay(cfg,idx,team,date,time,ignoreIds,len){len=len||cfg.gameLength;
  const rest=cfg.rules.minRest;const d=dayNum(date);
  for(const g of (idx.byTeam[team]||[])){if(ignoreIds&&ignoreIds.has(g.id))continue;
    const gd=dayNum(g.date);if(Math.abs(gd-d)<=rest)return 'rest';}
  const wk=weekKey(date);let n=0;for(const g of (idx.byTeam[team]||[])){if(ignoreIds&&ignoreIds.has(g.id))continue;if(weekKey(g.date)===wk)n++;}
  if(n>=cfg.rules.maxPerWeek)return 'week';
  for(const other of conflictsFor(cfg,team)){for(const g of (idx.byTeamDate[other+'|'+date]||[])){if(ignoreIds&&ignoreIds.has(g.id))continue;if(overlaps(time,len,g.time,gLen(cfg,g)))return 'coach';}}
  return null;
}
function addToIndex(idx,g){for(const t of [g.home,g.away]){(idx.byTeamDate[t+'|'+g.date]=idx.byTeamDate[t+'|'+g.date]||[]).push(g);(idx.byTeam[t]=idx.byTeam[t]||[]).push(g);}idx.bySlot[g.date+'|'+g.time+'|'+g.field]=g;(idx.byFieldDate[g.field+'|'+g.date]=idx.byFieldDate[g.field+'|'+g.date]||[]).push(g);}

function capacity(cfg){
  const slots=buildSlots(cfg);const out=[];
  for(const div of cfg.divisions){const n=div.teams.length;const need=Math.floor(n*div.gamesPerTeam/2);
    const own=slots.filter(s=>divAllowsSlot(cfg,div,s,false));
    const dates=new Set(own.map(s=>s.date));
    const maxByTeams=dates.size*Math.floor(n/2);
    out.push({div:div.id,name:div.name,need,slots:own.length,teamNights:maxByTeams,ok:need<=own.length&&need<=maxByTeams,weeks:new Set(own.map(s=>weekKey(s.date))).size});}
  return out;
}

function generate(cfg,seed){
  const R=rng(seed);const slots=buildSlots(cfg).filter(s=>!s.makeup);
  // order: date, time, random field
  slots.forEach(s=>s.r=R());slots.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.time-b.time||a.r-b.r);
  let gid=0;const pools={};const divOf={};const lateTime={};const weeksFor={};
  for(const div of cfg.divisions){pools[div.id]=roundRobin(div.teams,div.gamesPerTeam).map(g=>({...g,id:'g'+(++gid),div:div.id}));div.teams.forEach(t=>divOf[t]=div.id);
    const own=slots.filter(s=>divAllowsSlot(cfg,div,s,false));
    const lt={};own.forEach(s=>{lt[s.date]=Math.max(lt[s.date]||0,s.time);});lateTime[div.id]=lt;
    weeksFor[div.id]=[...new Set(own.map(s=>weekKey(s.date)))].sort((a,b)=>a-b);}
  const idx={byTeamDate:{},bySlot:{},byTeam:{},byFieldDate:{}};
  const stat={};cfg.divisions.forEach(d=>d.teams.forEach(t=>stat[t]={games:0,home:0,late:0,sat:0,tm:{},fd:{}}));
  const placed=[];
  for(const s of slots){
    let best=null,bestScore=Infinity;
    for(const div of cfg.divisions){if(!divAllowsSlot(cfg,div,s,false))continue;
      const pool=pools[div.id];if(!pool.length)continue;const L=divLen(cfg,div);if(!fieldFree(cfg,idx,s.field,s.date,s.time,L))continue;
      const W=weeksFor[div.id];const wi=W.indexOf(weekKey(s.date));
      const isLate=lateTime[div.id][s.date]===s.time&&Object.values(lateTime[div.id]).length>0&&s.time>=cfg.lateCutoff;
      const minRound=pool[0].round;
      for(const g of pool){if(g.round>minRound+2)break;
        let ok=true;
        for(const t of [g.home,g.away]){
          if((idx.byTeamDate[t+'|'+s.date]||[]).length){ok=false;break;}
          if(teamCanPlay(cfg,idx,t,s.date,s.time,null,L)){ok=false;break;}
          const pace=Math.ceil(div.gamesPerTeam*(wi+1)/W.length)+1;if(stat[t].games>=pace){ok=false;break;}
        }
        if(!ok)continue;
        let sc=(g.round-minRound)*6+R()*0.5;
        if(isLate)sc+=(stat[g.home].late+stat[g.away].late)*1.5;else sc-=(stat[g.home].late+stat[g.away].late)*0.3;
        if(s.dow===6)sc+=(stat[g.home].sat+stat[g.away].sat)*0.8;
        sc+=(stat[g.home].games+stat[g.away].games)*0.4;
        if(cfg.rules.balanceTimes!==false&&s.dow>=1&&s.dow<=5)sc+=((stat[g.home].tm[s.time]||0)+(stat[g.away].tm[s.time]||0))*2.2;
        if(cfg.rules.balanceFields!==false)sc+=((stat[g.home].fd[s.field]||0)+(stat[g.away].fd[s.field]||0))*1.4;
        if(sc<bestScore){bestScore=sc;best={g,div,isLate};}
      }
    }
    if(best){const {g,div,isLate}=best;pools[div.id].splice(pools[div.id].indexOf(g),1);
      let home=g.home,away=g.away;if(cfg.rules.balanceHome&&stat[away].home<stat[home].home){[home,away]=[away,home];}
      const game={id:g.id,div:div.id,home,away,date:s.date,time:s.time,field:s.field,len:divLen(cfg,div),status:'scheduled'};
      placed.push(game);addToIndex(idx,game);
      stat[home].games++;stat[away].games++;stat[home].home++;if(isLate){stat[home].late++;stat[away].late++;}if(s.dow===6){stat[home].sat++;stat[away].sat++;}
      for(const t of [home,away]){if(s.dow>=1&&s.dow<=5)stat[t].tm[s.time]=(stat[t].tm[s.time]||0)+1;stat[t].fd[s.field]=(stat[t].fd[s.field]||0)+1;}
    }
  }
  const unplaced=[];for(const d in pools)for(const g of pools[d])unplaced.push({...g,div:d});
  return {games:placed,unplaced};
}

function fairness(cfg,games){
  const out={};
  for(const div of cfg.divisions){
    const own=games.filter(g=>g.div===div.id&&g.status!=='postponed');
    const lt={};own.forEach(g=>{lt[g.date]=Math.max(lt[g.date]||0,g.time);});
    // late = latest start time used by division across season
    const rows=div.teams.map(t=>{const tg=own.filter(g=>g.home===t||g.away===t).sort((a,b)=>a.date<b.date?-1:1);
      let minGap=Infinity;for(let i=1;i<tg.length;i++)minGap=Math.min(minGap,dayNum(tg[i].date)-dayNum(tg[i-1].date));
      return {team:t,games:tg.length,home:tg.filter(g=>g.home===t).length,away:tg.filter(g=>g.away===t).length,
        late:tg.filter(g=>g.time>=cfg.lateCutoff).length,sat:tg.filter(g=>dowOf(g.date)===6).length,
        minGap:tg.length>1?minGap:null,
        tm:tg.reduce((m,g)=>{const w=dowOf(g.date);if(w>=1&&w<=5)m[g.time]=(m[g.time]||0)+1;return m;},{}),
        fd:tg.reduce((m,g)=>{m[g.field]=(m[g.field]||0)+1;return m;},{})};});
    const spread=k=>{const v=rows.map(r=>r[k]);return Math.max(...v)-Math.min(...v);};
    const times=[...new Set(own.filter(g=>{const w=dowOf(g.date);return w>=1&&w<=5;}).map(g=>g.time))].sort((a,b)=>a-b);
    const fields=[...new Set(own.map(g=>g.field))];
    const mapSpread=(k,keys)=>keys.length?Math.max(...keys.map(x=>{const v=rows.map(r=>r[k][x]||0);return Math.max(...v)-Math.min(...v);})):0;
    out[div.id]={rows,times,fields,spread:{games:spread('games'),late:spread('late'),sat:spread('sat'),ha:Math.max(...rows.map(r=>Math.abs(r.home-r.away))),time:times.length>1?mapSpread('tm',times):0,field:fields.length>1?mapSpread('fd',fields):0}};
  }
  return out;
}

function scoreSchedule(cfg,res){
  const f=fairness(cfg,res.games);let s=res.unplaced.length*1000;
  for(const d in f){s+=f[d].spread.games*50+f[d].spread.late*2+f[d].spread.sat*2+f[d].spread.ha*4+(cfg.rules.balanceTimes!==false?f[d].spread.time*4:0)+(cfg.rules.balanceFields!==false?f[d].spread.field*3:0);}
  return s;
}
function generateBest(cfg,tries){
  let best=null,bs=Infinity;for(let i=1;i<=tries;i++){const r=generate(cfg,i*7919);const s=scoreSchedule(cfg,r);if(s<bs){bs=s;best=r;}if(s===0)break;}
  return best;
}

function validate(cfg,games){
  const issues=[];const live=games.filter(g=>g.status!=='postponed'&&g.date);
  const black=new Set(cfg.blackouts);const seen={};
  const fd={};live.forEach(g=>(fd[g.field+'|'+g.date]=fd[g.field+'|'+g.date]||[]).push(g));
  for(const k in fd){const l=fd[k];for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++)if(overlaps(l[i].time,gLen(cfg,l[i]),l[j].time,gLen(cfg,l[j])))issues.push(`Two games overlap on the same field on ${l[i].date}`);}
  for(const g of live){
    if(black.has(g.date))issues.push(`Game on blackout date ${g.date}`);
    const div=cfg.divisions.find(d=>d.id===g.div);const f=cfg.fields.find(x=>x.id===g.field);
    if(!f||!f.divisions.includes(g.div))issues.push(`${div.name} game on a field it can't use`);
    if(g.time>div.latest)issues.push(`${div.name} game starts after its latest start time`);}
  const byTeam={};live.forEach(g=>[g.home,g.away].forEach(t=>(byTeam[t]=byTeam[t]||[]).push(g)));
  for(const t in byTeam){const tg=byTeam[t].sort((a,b)=>dayNum(a.date)-dayNum(b.date));
    for(let i=1;i<tg.length;i++){const gap=dayNum(tg[i].date)-dayNum(tg[i-1].date);if(gap<=cfg.rules.minRest)issues.push(`${t}: not enough rest before ${tg[i].date}`);}
    const wk={};tg.forEach(g=>{const k=weekKey(g.date);wk[k]=(wk[k]||0)+1;});for(const k in wk)if(wk[k]>cfg.rules.maxPerWeek)issues.push(`${t}: too many games in one week`);
    for(const o of conflictsFor(cfg,t))for(const g of tg)for(const h of (byTeam[o]||[]))if(h.date===g.date&&overlaps(g.time,gLen(cfg,g),h.time,gLen(cfg,h))&&t<o)issues.push(`Coach conflict: ${t} and ${o} both play ${g.date}`);}
  return issues;
}

// Rainout repair: propose makeup slots for postponed games without moving others
function makeupOptions(cfg,games,game,fromDate,taken){
  const div=cfg.divisions.find(d=>d.id===game.div);
  const from=fromDate||game.date;const slots=buildSlots(cfg).filter(s=>s.date>from&&divAllowsSlot(cfg,div,s,true));
  const live=games.filter(g=>g.status!=='postponed'&&g.id!==game.id).concat(taken||[]);
  const idx=makeIndex(cfg,live);const opts=[];
  const L=divLen(cfg,div);
  for(const s of slots){if(!fieldFree(cfg,idx,s.field,s.date,s.time,L))continue;
    let bad=false;for(const t of [game.home,game.away]){if((idx.byTeamDate[t+'|'+s.date]||[]).length||teamCanPlay(cfg,idx,t,s.date,s.time,null,L)){bad=true;break;}}
    if(bad)continue;
    const kind=s.makeup?'Makeup day':div.days.includes(s.dow)?(s.dow===6?'Regular Saturday':'Regular game night'):'Open night';
    const days=dayNum(s.date)-dayNum(game.origDate||game.date);
    let sc=days+(kind==='Open night'?5:0)+(kind==='Makeup day'?-3:0)+(s.time>=cfg.lateCutoff?0.5:0);
    opts.push({date:s.date,time:s.time,field:s.field,kind,score:sc});}
  opts.sort((a,b)=>a.score-b.score);
  // keep the best option per date/time, then top 5
  const seen=new Set(),out=[];for(const o of opts){const k=o.date+'|'+o.time;if(seen.has(k))continue;seen.add(k);out.push(o);if(out.length>=5)break;}
  return out;
}
function proposeMakeups(cfg,games,postponed,fromDate,picks){
  const taken=[];const res=[];
  for(const g of postponed){const opts=makeupOptions(cfg,games,g,fromDate,taken);
    let choice=null;const p=picks&&picks[g.id];
    if(p!=null&&opts[p])choice=p;else if(opts.length)choice=0;
    if(choice!=null){const o=opts[choice];taken.push({...g,date:o.date,time:o.time,field:o.field,status:'scheduled'});}
    res.push({game:g,options:opts,choice});}
  return res;
}

function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.cfg){({cfg,games,unplaced,built,stale,changeLog,wiz,reached}=s);basedOn=s.basedOn||null;changeLog=changeLog||[];wiz=wiz||0;reached=Math.max(reached||0,wiz);return true;}}catch(e){}return false;}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,2400);}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied');return true;}catch(e){toast('Copy blocked here. Select the text and copy it.');return false;}}
let uid=0;const newId=p=>p+Date.now().toString(36)+(++uid);

function header(){
  document.getElementById('leagueTitle').textContent=cfg.league||'New league';
  const lg=document.getElementById('leagueLogo');if(lg){if(cfg.logo){if(lg.getAttribute('src')!==cfg.logo)lg.src=cfg.logo;lg.alt=(cfg.league||'League')+' logo';lg.hidden=false;}else{lg.hidden=true;lg.removeAttribute('src');}}
  const n=games.filter(g=>g.status!=='postponed').length;
  const parts=[];
  if(cfg.start&&cfg.end)parts.push(`Season ${fmtDateLong(cfg.start)} to ${fmtDateLong(cfg.end)}`);
  if(cfg.divisions.length)parts.push(`${cfg.divisions.length} level${cfg.divisions.length===1?'':'s'}`);
  if(cfg.fields.length)parts.push(`${cfg.fields.length} ${cfg.fields.length===1?W().venue:W().venues}`);
  {const w=W();const tr=document.getElementById('tabRain');if(tr)tr.textContent=w.rainTab;const tu=document.getElementById('tabUmp');if(tu)tu.textContent=w.Official+' Corner';}
  if(built)parts.push(`${n} games scheduled`);
  document.getElementById('seasonLine').textContent=parts.join(' · ')||'Answer the setup questions to build a schedule';
  const pp=games.filter(g=>g.status==='postponed').length;const b=document.getElementById('ppCount');b.textContent=pp;b.hidden=!pp;
  document.querySelectorAll('nav.tabs button').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab===tab));
}
function statusBar(){
  if(!built)return '';
  const issues=validate(cfg,games);const pp=games.filter(g=>g.status==='postponed').length;
  return `<div class="statusbar">
    <span class="pill ${issues.length?'bad':'ok'}">${issues.length?issues.length+' rule violations':'0 rule violations'}</span>
    ${unplaced.length?`<span class="pill bad">${unplaced.length} games could not be placed</span>`:`<span class="pill ok">All games placed</span>`}
    ${pp?`<span class="pill rain">${pp} postponed, waiting for makeups</span>`:''}
    ${stale?`<span class="pill warn">Setup changed since this schedule was built</span>`:''}
  </div>`;
}

function loadLogo(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  const max=240;let w=img.naturalWidth||max,h=img.naturalHeight||max;const k=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
  let url=c.toDataURL('image/png');if(url.length>120000)url=c.toDataURL('image/jpeg',0.85);res(url);};img.src=r.result;};r.readAsDataURL(file);});}

const aan=x=>(/^[aeiou]/i.test(x)?'an ':'a ')+x;
const cap1=x=>x.charAt(0).toUpperCase()+x.slice(1);
function W(){const sp=SPORTS[(typeof cfg!=='undefined'&&cfg&&cfg.sport)]||SPORTS.baseball;
  return Object.assign({},sp,{Venue:cap1(sp.venue),Venues:cap1(sp.venues),Period:cap1(sp.period),Periods:cap1(sp.periods),Official:cap1(sp.official),Officials:cap1(sp.officials),
    rainTab:sp.outdoor?'Rainouts':'Postponements',rainDay:sp.outdoor?'Rain out this day':'Postpone this day',rainNoun:sp.outdoor?'rainout':'postponement',rainVerb:sp.outdoor?'rain out':'postpone'});}
function wt(x){const w=W();return String(x).replace(/\{(\w+)\}/g,(m,k)=>w[k]!=null?w[k]:m);}

const STEPS=[
  {id:'league',title:'League name',q:'What is the name of your league?',help:'This name appears at the top of every schedule and update you send.'},
  {id:'season',title:'Season dates',q:'When does your season run?',help:'Pick the first and last day games can be played. Then add any stretch with no games.'},
  {id:'levels',title:'Levels',q:'How many levels does your league have?',help:'Use the names your league uses, for example 8U, 10U, 12U, Varsity, Single A or Majors.'},
  {id:'teams',title:'Teams',q:'How many teams are in each level, and what are they called?',help:'Team names must be different across the whole league, so the schedule never mixes up two teams.'},
  {id:'fields',title:'{Venues}',q:'How many {venues} do you have, and which levels play on each?',help:'Levels that share a {venue} never get the same time slot.'},
  {id:'times',title:'Game days and times',q:'Which days are games played, and what time do they start?',help:'Check each day games are played. Weeknights start with 6:00 PM and 8:00 PM; add or remove times as needed. Hold a day for makeups only if it should stay empty until a {rainNoun}.'},
  {id:'levelplay',title:'Level schedules',q:'When does each level play, and how many games does each team get?',help:'Pick the days each level plays. Younger levels can have their own weeknight start times and shorter games, like 6:00 and 7:30 PM.'},
  {id:'coaches',title:'Shared coaches',q:'Do any managers or coaches have teams in more than one level?',help:'List every team each person coaches, two or more. Those teams never play at overlapping times on the same day. Back-to-back slots, like 6:00 and 8:00, are still allowed.'},

const gameDays=()=>[1,2,3,4,5,6,0].filter(d=>cfg.dayTimes[d]!==undefined);
const allTeams=()=>cfg.divisions.flatMap(d=>d.teams.filter(Boolean).map(t=>({t,d:d.name||'Unnamed level'})));
function stepErrors(id){
  const e=[];
  if(id==='league'&&!cfg.league.trim())e.push('Enter the league name.');if(id==='league'&&!cfg.sport)e.push('Pick a sport.');
  if(id==='season'){if(!cfg.start||!cfg.end)e.push('Pick the month, day and year for both the first and last game day.');else if(cfg.end<=cfg.start)e.push('The last game day must come after the first.');(cfg.noGame||[]).forEach((r,i)=>{if(!r.from)e.push(`No-game dates row ${i+1} needs a start date, or remove it.`);});}
  if(id==='levels'){if(!cfg.divisions.length)e.push('Add at least one level.');
    cfg.divisions.forEach((d,i)=>{if(!d.name.trim())e.push(`Level ${i+1} still needs a name. The gray text is only an example.`);});
    const n=cfg.divisions.map(d=>d.name.trim().toLowerCase()).filter(Boolean);if(new Set(n).size<n.length)e.push('Two levels have the same name.');}
  if(id==='teams'){cfg.divisions.forEach(d=>{if(d.teams.length<2)e.push(`${d.name||'A level'} needs at least 2 teams.`);if(d.teams.some(t=>!t.trim()))e.push(`Name every team in ${d.name||'each level'}.`);});
    const all=cfg.divisions.flatMap(d=>d.teams.map(t=>t.trim().toLowerCase())).filter(Boolean);const dup=all.filter((t,i)=>all.indexOf(t)!==i);if(dup.length)e.push(`These team names are used twice: ${[...new Set(dup)].join(', ')}.`);}
  if(id==='fields'){if(!cfg.fields.length)e.push(`Add at least one ${W().venue}.`);if(cfg.fields.some(f=>!f.name.trim()))e.push(`Give every ${W().venue} a name.`);
    cfg.divisions.forEach(d=>{if(!cfg.fields.some(f=>f.divisions.includes(d.id)))e.push(`${d.name} isn't assigned to any ${W().venue}.`);});}
  if(id==='times'){const gd=gameDays();if(!gd.length)e.push('Pick at least one game day.');
    gd.forEach(d=>{if(!cfg.dayTimes[d].length)e.push(`Add start times for ${DOW[d]}, or uncheck it.`);});
    if(gd.length&&gd.every(d=>cfg.makeupDays.includes(d)))e.push('At least one game day must be for regular games, not only makeups.');}
  if(id==='levelplay'){cfg.divisions.forEach(d=>{const ok=d.days.filter(x=>gameDays().includes(x)&&!cfg.makeupDays.includes(x));if(!ok.length)e.push(`Pick the days ${d.name} plays.`);if(!(d.gamesPerTeam>=1))e.push(`Enter games per team for ${d.name}.`);});}
  if(id==='coaches'){cfg.conflicts.forEach((c,i)=>{const who=c.name||`Shared coach ${i+1}`;const ts=c.teams.filter(Boolean);if(ts.length<c.teams.length)e.push(`Pick every team for ${who}, or remove the empty row.`);if(new Set(ts).size<ts.length)e.push(`${who} lists the same team twice.`);if(c.teams.length<2)e.push(`${who} needs at least 2 teams.`);});}
  if(id==='review'){for(const s of STEPS.slice(0,-1)){const x=stepErrors(s.id);if(x.length){e.push(`Finish "${s.title}" first.`);}}
    if(!e.length){const cap=capacity(cfg);cap.filter(c=>!c.ok).forEach(c=>e.push(`${c.name} needs ${c.need} games but only has room for ${Math.min(c.slots,c.teamNights)}. Add game days or ${W().venues}, extend the season, or lower games per team.`));}}
  return e;
}
function blackText(){
  const d=cfg.blackouts.slice().sort();const out=[];let i=0;
  while(i<d.length){let j=i;while(j+1<d.length&&d[j+1]===addDays(d[j],1))j++;out.push(i===j?d[i]:d[i]+' to '+d[j]);i=j+1;}
  return out.join('\n');
}
function countInput(id,val,min,max,label){return `<div class="counter"><button class="btn small" data-act="cnt" data-for="${id}" data-d="-1" aria-label="Fewer">−</button><input type="number" id="${id}" min="${min}" max="${max}" value="${val}" aria-label="${label}"><button class="btn small" data-act="cnt" data-for="${id}" data-d="1" aria-label="More">+</button></div>`;}

const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let dDraft={};
const TIME_OPTS=Array.from({length:29},(_,i)=>480+i*30);
function dateSel(key,val,label){
  const p=dDraft[key]||(val?{y:val.slice(0,4),m:val.slice(5,7),d:val.slice(8,10)}:{y:'',m:'',d:''});
  const yNow=new Date().getFullYear();const years=[];for(let y=yNow;y<=yNow+4;y++)years.push(String(y));
  const opt=(v,t,cur)=>`<option value="${v}" ${v===cur?'selected':''}>${t}</option>`;
  return `<div class="datesel" role="group" aria-label="${label}">
    <select id="ds_${key}_m" data-date="${key}" data-part="m" aria-label="${label} month">${opt('','Month',p.m)}${MONTHS.map((n,i)=>opt(String(i+1).padStart(2,'0'),n,p.m)).join('')}</select>
    <select id="ds_${key}_d" data-date="${key}" data-part="d" aria-label="${label} day">${opt('','Day',p.d)}${Array.from({length:31},(_,i)=>opt(String(i+1).padStart(2,'0'),i+1,p.d)).join('')}</select>
    <select id="ds_${key}_y" data-date="${key}" data-part="y" aria-label="${label} year">${opt('','Year',p.y)}${years.map(y=>opt(y,y,p.y)).join('')}</select></div>`;
}
function syncBlackouts(){const out=new Set();for(const r of (cfg.noGame||[])){if(!r.from)continue;let a=r.from,b=r.to&&r.to>=r.from?r.to:r.from,n=0;while(a<=b&&n<120){out.add(a);a=addDays(a,1);n++;}}cfg.blackouts=[...out].sort();}
function rangesFromBlackouts(list){const d=list.slice().sort();const out=[];let i=0;while(i<d.length){let j=i;while(j+1<d.length&&d[j+1]===addDays(d[j],1))j++;out.push({from:d[i],to:d[j]});i=j+1;}return out;}

// ===== Coaches Corner =====
function cSpots(t){const S=coach.spots||(coach.spots={});const sp=S[t];return (sp&&sp.length)?sp:W().spots.slice();}
const KEY_C='gdxSchedCoach1';
let coach={team:'',rosters:{},lineups:{},sel:{},duties:{},spots:{}};let cConfirmClear=false;
function saveCoach(){try{localStorage.setItem(KEY_C,JSON.stringify(coach));}catch(e){}}
function loadCoach(){try{const c=JSON.parse(localStorage.getItem(KEY_C)||'null');if(c&&typeof c==='object')coach=Object.assign({team:'',rosters:{},lineups:{},sel:{},duties:{},spots:{}},c);}catch(e){}}
const cRoster=t=>coach.rosters[t]||(coach.rosters[t]=[]);
const cNamed=t=>cRoster(t).filter(p=>p.name.trim());
function cTeamGames(t){return games.filter(g=>g.home===t||g.away===t).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.time-b.time);}
function cGameLabel(t,g){return `${fmtDateLong(g.date)}, ${fmtTime(g.time)} · ${g.home===t?'vs '+g.away:'at '+g.home}${g.status==='postponed'?' (postponed)':''}`;}
function cLineups(t){return coach.lineups[t]||(coach.lineups[t]={});}
function cHasCells(L){return L&&L.grid&&Object.values(L.grid).some(Boolean);}
function cKey(t,tg){const k=coach.sel[t];if(k&&(k==='practice'||tg.some(g=>g.id===k)))return k;const first=tg.find(g=>!cHasCells(cLineups(t)[g.id]))||tg[0];return first?first.id:'practice';}
function cLastInnings(t){const ls=Object.values(cLineups(t)).filter(cHasCells);return ls.length?ls[ls.length-1].innings:W().nper;}
function cGetLineup(t,k){const all=cLineups(t);if(!all[k])all[k]={innings:cLastInnings(t),grid:{}};return all[k];}
function cRows(t){const n=cNamed(t).length;const sp=cSpots(t);const rows=sp.slice();for(let i=1;i<=Math.max(0,n-sp.length);i++)rows.push('B'+i);return rows;}
const cRowLabel=r=>/^B\d+$/.test(r)?'Bench':r;
const isBench=r=>/^B\d+$/.test(r);
function cAnalyze(t,L){
  const rows=cRows(t),players=cNamed(t),inns=L.innings;
  const cnt={},where={},bench={},empty={};
  for(let i=1;i<=inns;i++){cnt[i]={};where[i]={};empty[i]=0;
    for(const r of rows){const pid=L.grid[r+'|'+i];if(!pid||!players.some(p=>p.id===pid)){if(!isBench(r))empty[i]++;continue;}
      cnt[i][pid]=(cnt[i][pid]||0)+1;(where[i][pid]=where[i][pid]||[]).push(cRowLabel(r));if(isBench(r))bench[pid]=(bench[pid]||0)+1;}}
  const benchVals=players.map(p=>bench[p.id]||0);const minB=Math.min(...benchVals);
  const issues=[];
  for(let i=1;i<=inns;i++){
    const dbl=players.filter(p=>(cnt[i][p.id]||0)>1),miss=players.filter(p=>!cnt[i][p.id]);
    const anyFilled=Object.keys(cnt[i]).length>0;
    if(dbl.length)issues.push({kind:'bad',text:`${W().Period} ${i}: ${dbl.map(p=>`${p.name} is in ${where[i][p.id].join(' and ')}`).join('; ')}`});
    if(anyFilled&&miss.length)issues.push({kind:'warn',text:`${W().Period} ${i}: ${miss.map(p=>p.name).join(', ')} ${miss.length===1?'is':'are'} not in the lineup`});
  }
  const sitTooMuch=players.filter(p=>(bench[p.id]||0)>minB+1);
  if(sitTooMuch.length){const least=players.filter(p=>(bench[p.id]||0)===minB);issues.push({kind:'warn',text:`${sitTooMuch.map(p=>p.name).join(', ')} ${sitTooMuch.length===1?'sits':'sit'} at least 2 ${W().periods} more than ${least.length<=3?least.map(p=>p.name).join(', '):least.length+' teammates'}${minB===0?', who haven\'t sat yet':''}`});}
  return {rows,players,cnt,where,bench,empty,issues,minB};
}
function cColor(t,pid){const i=cRoster(t).findIndex(p=>p.id===pid);return i<0?'':'pc'+(i%12);}

function renderCoach(){

// ===== Coaches Corner: game-day duties =====
const SIDE_LABEL={visitor:'Visiting team',home:'Home team',both:'Both teams'};
const WHEN_LABEL={first:'Before 1st game on {venue}',last:'After last game on {venue}',every:'Every game'};
const WHEN_SHORT={first:'Before 1st game',last:'After last game',every:'Every game'};
function dutyPreset(){const sp=cfg.sport||'baseball';const P={
  basketball:[['Set up benches and scorer\u2019s table','home','first',2],['Clock operator','home','every',1],['Official scorebook','home','every',1],['Visiting scorebook','visitor','every',1],['Clean up gym and bleachers','visitor','last',2]],
  volleyball:[['Put up nets and antennas','home','first',2],['Scoreboard / flip score','home','every',1],['Line judges','visitor','every',2],['Take down nets and put away poles','visitor','last',2]],
  tennis:[['Bring a new can of balls','home','every',1],['Report scores to the league','home','every',1],['Set up court signs and water','home','first',1],['Collect balls and trash, close gates','visitor','last',1]],
  soccer:[['Set up goals, nets and corner flags','home','first',2],['Take down nets and corner flags','visitor','last',2],['Sideline marshal','home','every',1],['Scorekeeper','visitor','every',1]],
  flagfootball:[['Set up cones and down markers','home','first',2],['Chain / down marker crew','both','every',1],['Put away cones and markers','visitor','last',2],['Scorekeeper','home','every',1]],
  pickleball:[['Bring new balls','home','every',1],['Set up portable nets','home','first',2],['Report scores to the league','home','every',1],['Take down nets, collect balls and trash','visitor','last',2]],
  youthfootball:[['Chain crew','home','every',3],['Clock operator','home','every',1],['Announcer','home','every',1],['Set up pylons and benches','home','first',2],['Clean up sidelines and bleachers','visitor','last',2]],

  {name:'Scoreboard operator / official pitch counter',side:'visitor',when:'every',count:1},
  {name:'Official scorekeeper / announcer',side:'home',when:'every',count:1},
  {name:'Pitch count cross-checker',side:'both',when:'every',count:1}
].map(d=>Object.assign({id:newId('u')},d));}
function cDuty(t){const D=coach.duties||(coach.duties={});return D[t]||(D[t]={on:false,list:[],assign:{},excused:[],unavail:{}});}
const SIDE_ORDER={visitor:0,home:1,both:2};
function dutyCols(D){return D.list.slice().sort((a,b)=>SIDE_ORDER[a.side]-SIDE_ORDER[b.side]).flatMap(d=>Array.from({length:Math.max(1,d.count)},(_,s)=>({d,s})));}
let fieldDayIdx=null;
function fieldDay(){if(fieldDayIdx&&fieldDayIdx.__n===games.length&&fieldDayIdx.__g===games)return fieldDayIdx;const m={};for(const g of games){if(g.status==='postponed')continue;const k=g.field+'|'+g.date;const x=m[k]||(m[k]={first:g.time,last:g.time});x.first=Math.min(x.first,g.time);x.last=Math.max(x.last,g.time);}m.__n=games.length;m.__g=games;return fieldDayIdx=m;}
function dutyApplies(t,g,d){if(g.status==='postponed')return false;const home=g.home===t;
  if(d.side==='home'&&!home)return false;if(d.side==='visitor'&&home)return false;
  if(d.when==='every')return true;const x=fieldDay()[g.field+'|'+g.date];if(!x)return false;return d.when==='first'?g.time===x.first:g.time===x.last;}
function dutyAnalyze(t,D,tg){
  const players=cNamed(t);const pids=new Set(players.map(p=>p.id));const count={};players.forEach(p=>count[p.id]=0);
  const issues=[];let open=0;
  for(const g of tg){const a=D.assign[g.id]||{};const un=new Set(D.unavail[g.id]||[]);const seen={};
    for(const d of D.list){if(!dutyApplies(t,g,d))continue;for(let s=0;s<Math.max(1,d.count);s++){const pid=(a[d.id]||[])[s];
      if(!pid||!pids.has(pid)){open++;continue;}count[pid]++;(seen[pid]=seen[pid]||[]).push(d.name);
      const nm=players.find(p=>p.id===pid).name;
      if(D.excused.includes(pid))issues.push({kind:'warn',text:`${fmtDateLong(g.date)}: ${nm} is excused but has a duty`});
      if(un.has(pid))issues.push({kind:'bad',text:`${fmtDateLong(g.date)}: ${nm} can't make this game but has a duty`});}}
    for(const pid in seen)if(seen[pid].length>1)issues.push({kind:'bad',text:`${fmtDateLong(g.date)}: ${players.find(p=>p.id===pid).name} has ${seen[pid].length} duties`});}
  const active=players.filter(p=>!D.excused.includes(p.id));const vals=active.map(p=>count[p.id]);const mn=vals.length?Math.min(...vals):0,mx=vals.length?Math.max(...vals):0;
  return {players,count,issues,open,mn,mx};
}
function dutyRandomize(t){fieldDayIdx=null;const D=cDuty(t);const tg=cTeamGames(t);const players=cNamed(t);const pids=new Set(players.map(p=>p.id));
  const A=dutyAnalyze(t,D,tg);const count=Object.assign({},A.count);let filled=0,left=0;
  const last={};// recent duty per family to vary jobs
  for(const g of tg){const a=D.assign[g.id]||(D.assign[g.id]={});const un=new Set(D.unavail[g.id]||[]);
    const used=new Set();for(const d of D.list){if(!dutyApplies(t,g,d))continue;for(const pid of (a[d.id]||[]))if(pid&&pids.has(pid))used.add(pid);}
    for(const d of D.list){if(!dutyApplies(t,g,d))continue;const arr=a[d.id]||(a[d.id]=[]);
      for(let s=0;s<Math.max(1,d.count);s++){if(arr[s]&&pids.has(arr[s]))continue;
        const cand=players.filter(p=>!D.excused.includes(p.id)&&!un.has(p.id)&&!used.has(p.id));
        if(!cand.length){left++;continue;}
        const mn=Math.min(...cand.map(p=>count[p.id]));let pool=cand.filter(p=>count[p.id]===mn);
        const varied=pool.filter(p=>last[p.id]!==d.id);if(varied.length)pool=varied;
        const p=pool[Math.floor(Math.random()*pool.length)];arr[s]=p.id;used.add(p.id);count[p.id]++;last[p.id]=d.id;filled++;}}}
  return {filled,left};}
function dutyGameRow(t,g,i,D,cols,players){
  const home=g.home===t;const a=D.assign[g.id]||{};const un=D.unavail[g.id]||[];

  const cells=cols.map(({d,s})=>{if(!dutyApplies(t,g,d))return `<td class="na" aria-label="Not needed"></td>`;
    const pid=(a[d.id]||[])[s]||'';const valid=players.some(p=>p.id===pid);
    const others=new Set();for(const x of D.list)if(dutyApplies(t,g,x))(a[x.id]||[]).forEach((q,j)=>{if(q&&!(x.id===d.id&&j===s))others.add(q);});
    const bad=valid&&(others.has(pid)||un.includes(pid));const warn=valid&&D.excused.includes(pid);
    return `<td><select id="ds_${g.id}_${d.id}_${s}" data-ds="${g.id}|${d.id}|${s}" class="cell duty ${valid?cColor(t,pid):''} ${bad?'dbl':warn?'warnc':''}" aria-label="${esc(d.name)}, ${fmtDateLong(g.date)}"><option value="">—</option>${players.map(p=>{const tags=[];if(D.excused.includes(p.id))tags.push('excused');if(un.includes(p.id))tags.push("can't make it");if(p.id!==pid&&others.has(p.id))tags.push('has a duty');return `<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)}${tags.length?' · '+tags.join(', '):''}</option>`;}).join('')}</select></td>`;}).join('');
  const unChips=un.map(pid=>{const p=players.find(x=>x.id===pid);return p?`<span class="tchip mini">${esc(p.name)}<button class="x" data-act="dUnRm" data-g="${g.id}" data-p="${pid}" aria-label="Remove ${esc(p.name)} from can't make it">×</button></span>`:'';}).join('');

    <td class="${home?'':'us'}">${esc(g.away)}</td><td class="${home?'us':''}">${esc(g.home)}</td>
    ${pp?`<td colspan="${cols.length}" class="sub">Postponed. Duties will show once it's rescheduled.</td>`:cells}
    <td class="unav"><div class="times">${unChips}${pp?'':`<select id="du_${g.id}" data-dun="${g.id}" aria-label="Mark a family unavailable for ${fmtDateLong(g.date)}"><option value="">+ Add</option>${avail.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>`}</div></td></tr>`;
}

const KEY_U='gdxSchedUmp1';
let ump={umps:[],crew:{},day:'',lvl:'all'};let uOpen=null;
function saveUmp(){try{localStorage.setItem(KEY_U,JSON.stringify(ump));}catch(e){}}
function loadUmp(){try{const u=JSON.parse(localStorage.getItem(KEY_U)||'null');if(u&&typeof u==='object')ump=Object.assign({umps:[],crew:{},day:'',lvl:'all'},u);}catch(e){}}
const uLive=()=>games.filter(g=>g.status!=='postponed'&&g.date);
function uCrew(g){return ump.crew[g.id]||(ump.crew[g.id]={n:2,ids:[]});}
const uNamed=()=>ump.umps.filter(u=>u.name.trim());
function uFits(u,g){const why=[];
  if(u.levels&&u.levels.length&&!u.levels.includes(g.div))why.push(`doesn't work ${divName(g.div)}`);
  const w=dowOf(g.date);if(u.days&&u.days.length&&!u.days.includes(w))why.push(`not available ${DOW[w]}`);
  if(u.from!=null&&g.time<u.from)why.push(`not before ${fmtTime(u.from)}`);
  if(u.to!=null&&g.time>u.to)why.push(`not after ${fmtTime(u.to)}`);
  return why;}
function uAssigned(){const m={};for(const g of uLive()){const c=ump.crew[g.id];if(!c)continue;c.ids.slice(0,c.n).forEach(id=>{if(id)(m[id]=m[id]||[]).push(g);});}return m;}
function uClash(list,g){return list.filter(h=>h.id!==g.id&&h.date===g.date&&overlaps(g.time,gLen(cfg,g),h.time,gLen(cfg,h)));}
function uPartnerNames(u){return (u.partners||[]).map(id=>(ump.umps.find(x=>x.id===id)||{}).name).filter(Boolean).join(', ');}
function uLevelSummary(u){if(!u.levels||!u.levels.length)return 'All levels';return u.levels.map(divName).join(', ');}
function uDaySummary(u){if(!u.days||!u.days.length)return 'Any day';return [1,2,3,4,5,6,0].filter(d=>u.days.includes(d)).map(d=>DOW[d]).join(', ');}
function uTimeSummary(u){if(u.from==null&&u.to==null)return 'Any time';return (u.from!=null?fmtTime(u.from):'Any')+' to '+(u.to!=null?fmtTime(u.to):'any');}
function uDates(){return [...new Set(uLive().map(g=>g.date))].sort();}
function uOpenOn(date,lvl){let n=0;for(const g of uLive()){if(g.date!==date)continue;if(lvl&&lvl!=='all'&&g.div!==lvl)continue;const c=ump.crew[g.id]||{n:2,ids:[]};for(let i=0;i<c.n;i++)if(!c.ids[i]||!ump.umps.some(u=>u.id===c.ids[i]))n++;}return n;}
function uTimeOpts(){return [...new Set([...gameDays().flatMap(d=>cfg.dayTimes[d]),...cfg.divisions.flatMap(d=>d.ownTimes||[])])].sort((a,b)=>a-b);}

function renderUmp(){
  if(!built)return `<section class="card"><h2>${W().Official} Corner</h2><p class="lead">Assign ${W().officials} to every game on the league schedule. Build the schedule first.</p><div><button class="btn primary" data-act="goSetup">Go to setup</button></div></section>`;
  const U=ump.umps;const named=uNamed();const asg=uAssigned();
  let h=`<section class="card"><div class="row"><h2>${W().Officials}</h2><span class="spacer"></span><label class="f" style="flex-direction:row;align-items:center;gap:8px">${W().Officials}${countInput('uN',U.length,0,60,'Number of '+W().officials)}</label></div>
    <p class="lead">Add your ${W().officials} and, if needed, the levels they can work, when they're available and who they like to work with. Leave those alone for ${aan(W().official)} who can work anything. Assignments are saved on this device only.</p>
    ${U.length?`<div class="scroll"><table class="umps"><thead><tr><th>Name</th><th>Levels</th><th>Days</th><th>Start times</th><th>Paired with</th><th class="num">Games</th><th></th></tr></thead><tbody>
    ${U.map((u,i)=>`<tr><td><input type="text" id="un${i}" data-un="${i}" value="${esc(u.name)}" placeholder="Type ${W().official} ${i+1} name" aria-label="${W().Official} ${i+1} name"></td>
      <td class="wrapc">${esc(uLevelSummary(u))}</td><td class="wrapc">${uDaySummary(u)}</td><td>${uTimeSummary(u)}</td><td class="wrapc">${esc(uPartnerNames(u)||'—')}</td><td class="num">${(asg[u.id]||[]).length}</td>
      <td><button class="btn small ${uOpen===u.id?'primary':''}" data-act="uEdit" data-u="${u.id}">${uOpen===u.id?'Done':'Edit limits'}</button></td></tr>
      ${uOpen===u.id?`<tr class="uedit"><td colspan="7"><div class="ed">
        <div class="row"><span class="f" style="font-size:13px;font-weight:600;color:var(--muted)">Levels ${esc(u.name||'this '+W().official)} can work</span><span class="spacer"></span><button class="btn link small" data-act="uAllLv" data-u="${u.id}">All levels</button></div>
        <div class="days">${cfg.divisions.map(d=>`<label class="chk"><input type="checkbox" id="ulv_${u.id}_${d.id}" data-ulv="${u.id}" value="${d.id}" ${(u.levels||[]).includes(d.id)?'checked':''}>${esc(d.name)}</label>`).join('')}</div>
        <div class="row"><span class="f" style="font-size:13px;font-weight:600;color:var(--muted)">Days available</span><span class="spacer"></span><button class="btn link small" data-act="uAllDays" data-u="${u.id}">Any day</button></div>
        <div class="days">${[1,2,3,4,5,6,0].map(d=>`<label class="chk"><input type="checkbox" id="udy_${u.id}_${d}" data-udy="${u.id}" value="${d}" ${(u.days||[]).includes(d)?'checked':''}>${DOW[d]}</label>`).join('')}</div>
        <div class="grid2"><label class="f">No games starting before<select id="uf_${u.id}" data-uft="${u.id}|from"><option value="">Any time</option>${uTimeOpts().map(t=>`<option value="${t}" ${u.from===t?'selected':''}>${fmtTime(t)}</option>`).join('')}</select></label>
        <label class="f">No games starting after<select id="ut_${u.id}" data-uft="${u.id}|to"><option value="">Any time</option>${uTimeOpts().map(t=>`<option value="${t}" ${u.to===t?'selected':''}>${fmtTime(t)}</option>`).join('')}</select></label></div>
        <span class="f" style="font-size:13px;font-weight:600;color:var(--muted)">Prefers to work with</span>
        <div class="days">${named.filter(o=>o.id!==u.id).map(o=>`<label class="chk"><input type="checkbox" id="upr_${u.id}_${o.id}" data-upr="${u.id}" value="${o.id}" ${(u.partners||[]).includes(o.id)?'checked':''}>${esc(o.name)}</label>`).join('')||'<span class="sub">Add more '+W().officials+' to pair them.</span>'}</div>
        <p class="sub" style="margin:0">Leaving every level or every day unchecked means no limit. Pairings go both ways.</p></div></td></tr>`:''}`).join('')}
    </tbody></table></div>`:'<p class="empty">Add your '+W().officials+' to start assigning games.</p>'}
  </section>`;
  if(named.length<1)return h;
  const dates=uDates();if(!dates.length)return h+`<section class="card"><p class="lead">No games are scheduled.</p></section>`;
  if(!dates.includes(ump.day)){ump.day=dates.find(d=>uOpenOn(d,ump.lvl)>0)||dates[0];}
  const day=ump.day;const di=dates.indexOf(day);
  const dg=uLive().filter(g=>g.date===day&&(ump.lvl==='all'||g.div===ump.lvl)).sort((a,b)=>fieldName(a.field).localeCompare(fieldName(b.field),undefined,{numeric:true})||a.time-b.time);
  let seasonOpen=0;for(const d of dates)seasonOpen+=uOpenOn(d,ump.lvl);
  const dayIssues=[];
  const rows=[];let lastField=null;
  for(const g of dg){
    if(g.field!==lastField){rows.push(`<tr class="fieldhead"><th colspan="5">${esc(fieldName(g.field))}</th></tr>`);lastField=g.field;}
    const c=ump.crew[g.id]||{n:2,ids:[]};
    const sameField=dg.filter(x=>x.field===g.field&&x.id!==g.id);
    const prev=sameField.filter(x=>x.time<g.time).sort((a,b)=>b.time-a.time)[0];
    const onField=new Set(sameField.flatMap(x=>{const cc=ump.crew[x.id];return cc?cc.ids.slice(0,cc.n).filter(Boolean):[];}));
    const slots=[];
    for(let s=0;s<c.n;s++){const cur=c.ids[s]||'';const curU=named.find(u=>u.id===cur);
      const taken=new Set(c.ids.slice(0,c.n).filter((x,j)=>x&&j!==s));
      let cls='';let tip='';
      if(curU){const clash=uClash(asg[cur]||[],g);const why=uFits(curU,g);
        if(clash.length){cls='dbl';const pair=[g,clash[0]].sort((x,y)=>x.time-y.time||fieldName(x.field).localeCompare(fieldName(y.field)));dayIssues.push({kind:'bad',text:`${curU.name} is double booked: ${fmtTime(pair[0].time)} ${fieldName(pair[0].field)} and ${fmtTime(pair[1].time)} ${fieldName(pair[1].field)}`});}
        else if(why.length){cls='warnc';dayIssues.push({kind:'warn',text:`${curU.name}, ${fmtTime(g.time)} ${fieldName(g.field)}: ${why.join(', ')}`});}
        if(taken.has(cur)){cls='dbl';dayIssues.push({kind:'bad',text:`${curU.name} is listed twice on the ${fmtTime(g.time)} ${fieldName(g.field)} game`});}}
      const grpP=[],grpA=[],grpB=[],grpC=[];
      const crewOthers=c.ids.slice(0,c.n).filter((x,j)=>x&&j!==s);const partnerOf={};crewOthers.forEach(o=>{const ou=named.find(z=>z.id===o);(ou&&ou.partners||[]).forEach(p=>{partnerOf[p]=ou.name;});});
      for(const u of named){const clash=uClash(asg[u.id]||[],g);const why=uFits(u,g);const tags=[];
        if(clash.length&&u.id!==cur)tags.push(`busy ${fmtTime(clash[0].time)} ${fieldName(clash[0].field)}`);
        why.forEach(w=>tags.push(w));if(taken.has(u.id))tags.push('already on this crew');
        const opt=`<option value="${u.id}" ${u.id===cur?'selected':''}>${esc(u.name)}${tags.length?' · '+tags.join(', '):''}</option>`;
        if(tags.length&&u.id!==cur)grpC.push(opt);else if(partnerOf[u.id])grpP.push(opt);else if(onField.has(u.id))grpA.push(opt);else grpB.push(opt);}
      slots.push(`<select id="uc_${g.id}_${s}" data-uc="${g.id}|${s}" class="cell ucell ${cls}" aria-label="${W().Official} ${s+1}, ${fmtTime(g.time)} ${esc(fieldName(g.field))}"><option value="">— Open —</option>${grpP.length?`<optgroup label="Paired with ${esc([...new Set(Object.values(partnerOf))].join(', '))}">${grpP.join('')}</optgroup>`:''}${grpA.length?`<optgroup label="Already on ${esc(fieldName(g.field))} today">${grpA.join('')}</optgroup>`:''}${grpB.length?`<optgroup label="Available">${grpB.join('')}</optgroup>`:''}${grpC.length?`<optgroup label="Check first">${grpC.join('')}</optgroup>`:''}</select>`);}
    const prevCrew=prev?(ump.crew[prev.id]||{ids:[]}).ids.filter(Boolean):[];
    const crewNow=c.ids.slice(0,c.n).filter(Boolean);const hasOpen=crewNow.length<c.n;const addBtns=[];
    if(hasOpen){const seenP=new Set();for(const id of crewNow){const cu=named.find(z=>z.id===id);if(!cu)continue;for(const pid of (cu.partners||[])){if(crewNow.includes(pid)||seenP.has(pid))continue;const pu=named.find(z=>z.id===pid);if(!pu)continue;if(uClash(asg[pid]||[],g).length||uFits(pu,g).length)continue;seenP.add(pid);addBtns.push(`<button class="btn link small" data-act="uAddPartner" data-g="${g.id}" data-u="${pid}">Add ${esc(pu.name)} (${esc(cu.name)}'s partner)</button>`);}}}
    rows.push(`<tr><td class="t">${fmtTime(g.time)}</td><td>${esc(divName(g.div))}</td><td class="gm">${esc(g.away)} <span class="sub">at</span> ${esc(g.home)}</td>
      <td><div class="crew">${slots.join('')}</div><div class="row" style="gap:2px 6px">${addBtns.join('')}${prev&&prevCrew.length?`<button class="btn link small" data-act="uSame" data-g="${g.id}" data-from="${prev.id}">Same crew as ${fmtTime(prev.time)}</button>`:''}</div></td>
      <td><div class="counter mini"><button class="btn small" data-act="ucnt" data-g="${g.id}" data-d="-1" aria-label="Fewer ${W().officials}">−</button><span>${c.n}</span><button class="btn small" data-act="ucnt" data-g="${g.id}" data-d="1" aria-label="More ${W().officials}">+</button></div></td></tr>`);
  }
  const dayOpen=uOpenOn(day,ump.lvl);
  const seen=new Set();const issues=dayIssues.filter(x=>!seen.has(x.text)&&seen.add(x.text));
  h+=`<section class="card"><div class="row"><h2>Assign games</h2><span class="spacer"></span><button class="btn small" data-act="uCopyDay">Copy this day for Excel or Google Sheets</button></div>
    <div class="row">
      <button class="btn small" data-act="uPrev" ${di<=0?'disabled':''} aria-label="Previous day">‹</button>
      <label class="f" style="flex:1 1 260px">Day<select id="uDay">${dates.map(d=>{const o=uOpenOn(d,ump.lvl);return `<option value="${d}" ${d===day?'selected':''}>${fmtDateLong(d)}${o?` · ${o} open`:' · ✓ covered'}</option>`;}).join('')}</select></label>
      <button class="btn small" data-act="uNext" ${di>=dates.length-1?'disabled':''} aria-label="Next day">›</button>
      <label class="f" style="flex:1 1 200px">Level<select id="uLvl"><option value="all">All levels</option>${cfg.divisions.map(d=>`<option value="${d.id}" ${ump.lvl===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label>
      <button class="btn small" data-act="uNextOpen" ${seasonOpen?'':'disabled'}>Next day with open spots</button>
    </div>
    <div class="statusbar"><span class="pill ${dayOpen?'warn':'ok'}">${dayOpen?`${dayOpen} open spot${dayOpen===1?'':'s'} on ${fmtDateLong(day)}`:`Every game on ${fmtDateLong(day)} is covered`}</span><span class="pill ${seasonOpen?'':'ok'}">${seasonOpen?`${seasonOpen} open spots this season`:'Whole season covered'}</span>${issues.map(x=>`<span class="pill ${x.kind}">${esc(x.text)}</span>`).join('')}</div>
    ${dg.length?`<div class="scroll"><table class="uass"><thead><tr><th>Time</th><th>Level</th><th>Game</th><th>${W().Officials}</th><th>Crew size</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`:'<p class="empty">No games for this level on this day.</p>'}
    <p class="sub" style="margin:0">In each list, ${aan(W().official)}'s preferred partner comes first, then ${W().officials} already working this ${W().venue} today, so they can stay put. "Check first" means they're busy, outside their limits, or already on the crew.</p>
  </section>`;
  const totals=named.map(u=>{const gs=(asg[u.id]||[]).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.time-b.time);
    let clashes=0,outs=0;gs.forEach(g=>{if(uClash(gs,g).length)clashes++;if(uFits(u,g).length)outs++;});
    return {u,gs,days:new Set(gs.map(g=>g.date)).size,clashes,outs};});
  h+=`<section class="card"><h2>${W().Official} schedules</h2><p class="lead">Season totals for each ${W().official}. Copy ${aan(W().official)}'s schedule to text or email it to them.</p>
    <div class="scroll"><table class="utot"><thead><tr><th>${W().Official}</th><th class="num">Games</th><th class="num">Days</th><th>Next game</th><th>Problems</th><th></th></tr></thead><tbody>
    ${totals.map(x=>{const nxt=x.gs[0];return `<tr><td>${esc(x.u.name)}</td><td class="num">${x.gs.length}</td><td class="num">${x.days}</td><td>${nxt?`${fmtDateLong(nxt.date)}, ${fmtTime(nxt.time)}, ${esc(fieldName(nxt.field))}`:'<span class="sub">None yet</span>'}</td>
      <td>${x.clashes?`<span class="pill bad">${x.clashes} double booked</span>`:''}${x.outs?`<span class="pill warn">${x.outs} outside limits</span>`:''}${!x.clashes&&!x.outs?'<span class="sub">None</span>':''}</td>
      <td><button class="btn small" data-act="uCopy" data-u="${x.u.id}" ${x.gs.length?'':'disabled'}>Copy schedule</button></td></tr>`;}).join('')}
    </tbody></table></div></section>`;
  return h;
}
function uCopySchedule(uid){const u=ump.umps.find(x=>x.id===uid);const gs=(uAssigned()[uid]||[]).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.time-b.time);
  let s=`${cfg.league} ${W().official} schedule: ${u.name}\n`;let last='';
  for(const g of gs){if(g.date!==last){s+=`\n${fmtDateLong(g.date)}\n`;last=g.date;}
    const c=ump.crew[g.id];const partners=c.ids.slice(0,c.n).filter(id=>id&&id!==uid).map(id=>(ump.umps.find(x=>x.id===id)||{}).name).filter(Boolean);
    s+=`  ${fmtTime(g.time)}  ${fieldName(g.field)}  ${divName(g.div)}: ${g.away} at ${g.home}${partners.length?`  (with ${partners.join(', ')})`:''}\n`;}
  copyText(s.trim()).then(ok=>{if(ok)toast(`Copied ${u.name}'s schedule (${gs.length} games)`);});}
function uCopyDay(){const day=ump.day;const dg=uLive().filter(g=>g.date===day&&(ump.lvl==='all'||g.div===ump.lvl)).sort((a,b)=>a.time-b.time||fieldName(a.field).localeCompare(fieldName(b.field),undefined,{numeric:true}));
  const mx=Math.max(2,...dg.map(g=>(ump.crew[g.id]||{n:2}).n));
  const rows=[['Date','Time',W().Venue,'Level','Away','Home',...Array.from({length:mx},(_,i)=>W().Official+' '+(i+1))]];
  dg.forEach(g=>{const c=ump.crew[g.id]||{n:2,ids:[]};rows.push([g.date,fmtTime(g.time),fieldName(g.field),divName(g.div),g.away,g.home,...Array.from({length:mx},(_,i)=>i<c.n?((ump.umps.find(u=>u.id===c.ids[i])||{}).name||'OPEN'):'')]);});
  copyText(rows.map(r=>r.join('\t')).join('\n')).then(ok=>{if(ok)toast(`Copied ${dg.length} games for ${fmtDateLong(day)}`);});}
function uSetCount(n){n=Math.max(0,Math.min(60,n));while(ump.umps.length<n)ump.umps.push({id:newId('m'),name:'',levels:[],days:[],from:null,to:null});
  while(ump.umps.length>n){const u=ump.umps.pop();ump.umps.forEach(o=>{if(o.partners)o.partners=o.partners.filter(x=>x!==u.id);});for(const k in ump.crew)ump.crew[k].ids=ump.crew[k].ids.map(x=>x===u.id?'':x);if(uOpen===u.id)uOpen=null;}saveUmp();render();}

// ===== Sharing =====
function sameAsShared(){return SHARED&&JSON.stringify([cfg,games])===JSON.stringify([SHARED.cfg,SHARED.games]);}
function fmtStamp(t){try{return new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return '';}}
function shareBarHtml(){
  let h='';
  if(sharePanel){h+=`<section class="card sharecard"><h2>Share ${esc(cfg.league||'your league')}</h2>
    <p class="lead">This saves your setup, schedule, fairness report and ${W().rainNoun} changes into this page. Anyone you send the page's link to will open it on exactly what you see now.</p>
    <p class="lead">They can click around and try things, but their changes stay on their own device and never change yours. You can publish again any time to update what they see.</p>
    ${built?'':'<div class="note">You haven\'t built a schedule yet, so they will only see your setup answers.</div>'}
    <div class="row"><button class="btn primary" data-act="doShare">Publish to the link</button><button class="btn" data-act="closeShare">Cancel</button></div>
    <p class="sub" style="margin:0">After publishing, use the <b>Share</b> menu at the top of the page to choose who can open the link.</p></section>`;}
  if(SHARED&&SHARED.cfg){const same=sameAsShared();
    if(isEditor)h+=`<div class="note info sharebar"><span>Everyone with this page's link starts on <b>${esc(SHARED.cfg.league||'your league')}</b> as you published it ${fmtStamp(SHARED.stamp)}.${same?'':' You have changes they can\'t see yet.'}</span>${same?'':`<button class="btn small" data-act="openShare">Update what they see</button>`}</div>`;
    else h+=`<div class="note info sharebar"><span>You're viewing <b>${esc(SHARED.cfg.league||'this league')}</b> as shared by its scheduler. Explore freely; your changes stay on this device only.</span>${same?'':`<button class="btn small" data-act="useShared">Back to the shared version</button>`}</div>`;}
  return h;
}
function applyShared(){const c=JSON.parse(JSON.stringify(SHARED));cfg=c.cfg;games=c.games||[];unplaced=c.unplaced||[];built=!!c.built;changeLog=c.changeLog||[];stale=false;picks={};dDraft={};
  wiz=STEPS.length-1;reached=STEPS.length-1;basedOn=SHARED.stamp;tab=built?'schedule':'setup';showErr=false;fixConfig();save();}
function buildPage(shared){
  const resetEl=document.head&&document.head.querySelector('style');const reset=resetEl?resetEl.textContent:'';
  const css=document.getElementById('appStyle').textContent;const js=document.getElementById('appScript').textContent;
  const data=JSON.stringify(shared).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
    +'<title>Lineup Scheduler</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="'+FONT_URL+'">\n'
    +'<style id="appStyle">'+css+'</style>\n<script type="application/json" id="sharedLeague">'+data+'<\/script>\n<script id="appScript">'+js+'<\/script>\n</body></html>';
}
async function doShare(btn){
  if(!artifactApi){toast('Sharing isn\'t available in this view.');return;}
  btn.disabled=true;btn.textContent='Publishing…';
  const stamp=Date.now();const shared={stamp,cfg,games,unplaced,built,changeLog};
  const prevBased=basedOn;basedOn=stamp;save();
  try{await artifactApi.publish(buildPage(shared));toast('Published. Reloading…');}
  catch(e){basedOn=prevBased;save();const code=e&&e.code;
    if(code==='not_writer'||code==='not_granted'||code==='consent_required'||code==='capability_disabled'||code==='capability_removed'||code==='not_declared'){canShare=false;sharePanel=false;render();toast('Only the page owner can publish the league to the link.');}
    else if(code==='conflict'){toast('The page was just updated. Reloading…');}
    else if(code==='too_large'){btn.disabled=false;btn.textContent='Publish to the link';toast('This league is too large to publish into the page.');}
    else if(code==='rate_limited'){btn.disabled=false;btn.textContent='Publish to the link';toast('Too many publishes in a row. Wait a minute and try again.');}
    else{btn.disabled=false;btn.textContent='Publish to the link';toast('Couldn\'t publish right now. Try again in a minute.');}}
}
document.addEventListener('click',e=>{if(e.target.id==='shareBtn'){sharePanel=true;tab=tab||'setup';render();window.scrollTo({top:0});}});

let filePanel=false, pendingFile=null;
function slugify(x){return (String(x||'league').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'league');}
function leagueFileJSON(all){const o={app:'gdx-scheduler',v:1,saved:new Date().toISOString(),league:{cfg,games,unplaced,built,changeLog}};if(all){o.coach=coach;o.ump=ump;}return JSON.stringify(o);}
function downloadLeague(all){try{const blob=new Blob([leagueFileJSON(all)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=slugify(cfg.league)+(all?'-everything':'')+'.gdx.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);toast('League file saved to your downloads');}catch(e){toast('Couldn\'t save the file in this browser.');}}
function readLeagueFile(f){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||o.app!=='gdx-scheduler'||!o.league||!o.league.cfg)throw 0;pendingFile=o;filePanel=true;render();window.scrollTo({top:0});}catch(e){toast('That file isn\'t a GameDay Express league file.');}};r.onerror=()=>toast('That file couldn\'t be read.');r.readAsText(f);}
function applyLeagueFile(o){const L=o.league;cfg=L.cfg;games=L.games||[];unplaced=L.unplaced||[];built=!!L.built;changeLog=L.changeLog||[];stale=false;picks={};dDraft={};showErr=false;fixConfig();
  wiz=built?STEPS.length-1:0;reached=built?STEPS.length-1:0;tab=built?'schedule':'setup';
  if(o.coach){coach=Object.assign({team:'',rosters:{},lineups:{},sel:{},duties:{},spots:{}},o.coach);saveCoach();}
  if(o.ump){ump=Object.assign({umps:[],crew:{},day:'',lvl:'all'},o.ump);saveUmp();}
  save();pendingFile=null;filePanel=false;render();window.scrollTo({top:0});toast('Opened '+(cfg.league||'league'));}
function fileBarHtml(){if(!filePanel)return '';
  if(pendingFile){const L=pendingFile.league;const n=(L.games||[]).length;const extra=[pendingFile.coach?'coach lineups and duties':'',pendingFile.ump?'officials and assignments':''].filter(Boolean);
    return `<section class="card filecard"><h2>Open ${esc(L.cfg.league||'this league')}?</h2>
      <p class="lead">This file has ${L.cfg.divisions?L.cfg.divisions.length:0} levels and ${n} scheduled games${extra.length?`, plus ${extra.join(' and ')}`:''}. Opening it replaces the league saved in this browser${extra.length?' and the matching Coaches Corner and officials data':''}.</p>
      <div class="row"><button class="btn primary" data-act="fileOpenNow">Open this league</button><button class="btn" data-act="fileCancel">Cancel</button></div></section>`;}
  return `<section class="card filecard"><h2>Save or open a league</h2>
    <p class="lead">Your league is saved in this browser automatically. To move it to another computer, or to give it to coaches and officials, save it as a file and send it to them by email or text. They open it here with <b>Open a league file</b>.</p>
    <div class="row"><button class="btn primary" data-act="fileSave">Save league file</button><button class="btn" data-act="fileSaveAll">Save everything</button>
      <label class="btn filebtn">Open a league file<input type="file" id="leagueFileIn" accept=".json,application/json"></label>
      <span class="spacer"></span><button class="btn link small" data-act="fileCancel">Close</button></div>
    <p class="sub" style="margin:0"><b>Save league file</b> has your setup and schedule, which is what coaches and officials need. <b>Save everything</b> also includes this browser's Coaches Corner lineups and duties and officials' assignments, for moving your own work to another computer.</p></section>`;}

function setCount(id,n){
  if(id==='nlv'){n=Math.max(0,Math.min(12,n));while(cfg.divisions.length<n)cfg.divisions.push({id:newId('d'),name:'',teams:[],gamesPerTeam:12,days:[],latest:1200});
    while(cfg.divisions.length>n){const d=cfg.divisions.pop();cfg.fields.forEach(f=>f.divisions=f.divisions.filter(x=>x!==d.id));cfg.conflicts.forEach(c=>c.teams=c.teams.map(t=>d.teams.includes(t)?'':t));}}
  else if(id.startsWith('ntm')){const d=cfg.divisions[+id.slice(3)];n=Math.max(0,Math.min(30,n));while(d.teams.length<n)d.teams.push('');while(d.teams.length>n){const t=d.teams.pop();cfg.conflicts.forEach(c=>c.teams=c.teams.map(x=>x===t?'':x));}}
  else if(id==='nfd'){n=Math.max(0,Math.min(20,n));while(cfg.fields.length<n)cfg.fields.push({id:newId('f'),name:W().Venue+' '+(cfg.fields.length+1),divisions:cfg.divisions.length===1?[cfg.divisions[0].id]:[]});cfg.fields.length=n;}
  else if(id.startsWith('gpt')){cfg.divisions[+id.slice(3)].gamesPerTeam=Math.max(1,Math.min(40,n));}
  else if(id==='mr'){cfg.rules.minRest=Math.max(0,Math.min(6,n));}
  else if(id==='mw'){cfg.rules.maxPerWeek=Math.max(1,Math.min(7,n));}
  touched();render();
}

    if(!src){toast('No earlier lineup to copy yet');return;}
    all[k]={innings:src.innings,grid:Object.assign({},src.grid)};coach.sel[t]=k;saveCoach();render();toast('Copied the last lineup. Adjust as needed.');return;}
  if(a==='cnt'){const inp=document.getElementById(b.dataset.for);setCount(b.dataset.for,(parseInt(inp.value,10)||0)+(+b.dataset.d));return;}
  if(a==='next'){const errs=stepErrors(STEPS[wiz].id);if(errs.length){showErr=true;render();return;}goStep(wiz+1);return;}
  if(a==='prev'){goStep(wiz-1);return;}
  if(a==='goStep'){goStep(+b.dataset.i);return;}
  if(a==='allDays'){const d=cfg.divisions[+b.dataset.i];const gd=gameDays().filter(x=>!cfg.makeupDays.includes(x));d.days=b.dataset.on==='1'?gd.slice():[];touched();render();return;}
  if(a==='allGameDays'){[1,2,3,4,5,6].forEach(d=>{if(cfg.dayTimes[d]===undefined)cfg.dayTimes[d]=d===6?[540,660,780,900]:[1080,1200];});touched();render();return;}
  if(a==='rmOwn'){const d=cfg.divisions[+b.dataset.i];d.ownTimes=d.ownTimes.filter(t=>t!==+b.dataset.t);if(!d.ownTimes.length)delete d.ownTimes;touched();render();return;}
  if(a==='rmTime'){const d=+b.dataset.d;cfg.dayTimes[d]=(cfg.dayTimes[d]||[]).filter(t=>t!==+b.dataset.t);touched();render();return;}
  if(a==='copyWk'){const src=cfg.dayTimes[+b.dataset.d].slice();[1,2,3,4,5].forEach(d=>{if(cfg.dayTimes[d]!==undefined)cfg.dayTimes[d]=src.slice();});touched();render();toast('Copied to every weeknight with games');return;}
  if(a==='addNg'){cfg.noGame=cfg.noGame||[];cfg.noGame.push({from:'',to:''});touched();render();return;}
  if(a==='rmNg'){cfg.noGame.splice(+b.dataset.i,1);dDraft={};syncBlackouts();touched();render();return;}
  if(a==='addConf'){cfg.conflicts.push({name:'',teams:['','']});touched();render();return;}
  if(a==='addConfTeam'){cfg.conflicts[+b.dataset.i].teams.push('');touched();render();return;}
  if(a==='rmConfTeam'){cfg.conflicts[+b.dataset.i].teams.splice(+b.dataset.j,1);touched();render();return;}
  if(a==='rmConf'){cfg.conflicts.splice(+b.dataset.i,1);touched();render();return;}
  if(a==='build'){const errs=stepErrors('review');if(errs.length){showErr=true;render();return;}
    b.disabled=true;b.textContent='Building…';setTimeout(()=>{
    const r=generateBest(cfg,25);games=r.games.map(g=>({...g}));unplaced=r.unplaced;built=true;stale=false;picks={};changeLog=[];showErr=false;save();setTab('schedule');toast(`Built ${games.length} games`);},30);return;}
  if(a==='sample'){cfg=sampleConfig();fixConfig();dDraft={};games=[];unplaced=[];built=false;stale=false;picks={};changeLog=[];wiz=0;reached=STEPS.length-1;showErr=false;save();render();toast('Sample league filled in. Step through to see each answer.');return;}
  if(a==='clear'){cfg=blankConfig();fixConfig();dDraft={};games=[];unplaced=[];built=false;stale=false;picks={};changeLog=[];wiz=0;reached=0;showErr=false;save();render();return;}
  if(a==='goSetup')setTab('setup');
  if(a==='rainDay'){let n=0;games.forEach(g=>{if(g.date===b.dataset.d&&g.status!=='postponed'){g.status='postponed';n++;}});save();toast(`${n} games postponed`);setTab('rain');}
  if(a==='pp'){const g=games.find(x=>x.id===b.dataset.id);g.status='postponed';save();render();toast('Game postponed. Open '+W().rainTab+' to place it.');}
  if(a==='unpp'){const g=games.find(x=>x.id===b.dataset.id);g.status=g.origDate?'rescheduled':'scheduled';delete picks[g.id];save();render();}
  if(a==='apply'){const pp=games.filter(g=>g.status==='postponed').sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.time-y.time);
    const prop=proposeMakeups(cfg,games,pp,null,picks);let n=0;
    prop.forEach(p=>{if(p.choice==null)return;const o=p.options[p.choice];const g=p.game;
      changeLog.push({div:g.div,home:g.home,away:g.away,fromDate:g.date,fromTime:g.time,date:o.date,time:o.time,field:fieldName(o.field)});
      if(!g.origDate)g.origDate=g.date;Object.assign(g,{date:o.date,time:o.time,field:o.field,status:'rescheduled'});n++;});
    picks={};save();render();toast(`${n} makeup${n===1?'':'s'} scheduled`);}
  if(a==='copyMsg')copyText(directorsMessage());
  if(a==='copyTsv'){const rows=[['Date','Day','Time',W().Venue,'Level','Away','Home','Status']];
    games.slice().sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.time-y.time).forEach(g=>rows.push([g.date,DOW[dowOf(g.date)],fmtTime(g.time),fieldName(g.field),divName(g.div),g.away,g.home,g.status==='postponed'?'Postponed':g.status==='rescheduled'?'Makeup':'Scheduled']));
    copyText(rows.map(r=>r.join('\t')).join('\n')).then(ok=>{if(ok)toast(`Copied ${rows.length-1} games. Paste into a sheet.`);});}
});

// boot: a scheduler starts at question 1
loadCoach();loadUmp();
const hadLocal=load();
if(SHARED&&SHARED.cfg&&(!hadLocal||basedOn!==SHARED.stamp))applyShared();
else if(!hadLocal){cfg=blankConfig();wiz=0;tab='setup';}
fixConfig();render();
(async()=>{try{if(!window.claude||!window.claude.use)return;artifactApi=await window.claude.use('artifact');if(!artifactApi)return;
  const u=await window.claude.use('user');isEditor=u?await u.canEdit():true;canShare=isEditor;render();}catch(e){}})();

</script>
