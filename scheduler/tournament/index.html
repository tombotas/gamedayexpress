<body>
<style id="appStyle">
:root{
  --bg:#0d0e12; --surface:#16171c; --surface-2:#1e2026; --ink:#eceef2; --muted:#9ba1ad; --line:#2b2e36;
  --accent:#e8341a; --accent-soft:#3b1d19; --on-accent:#ffffff; --good:#5cc98a; --good-soft:#18301f;
  --rain:#7fb2ea; --rain-soft:#18263a; --warn:#f0b04a; --warn-soft:#33270f; --bad:#ff8a7d; --bad-soft:#3d1c19;
  --pc0:#5e2c26; --pc1:#5e3f1c; --pc2:#55491a; --pc3:#3a5022; --pc4:#214a31; --pc5:#1d4845; --pc6:#21405f; --pc7:#35315f; --pc8:#4a2a5c; --pc9:#592a42; --pc10:#4b4334; --pc11:#36423a;
  color-scheme:dark;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:12px}
.brandrow{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px}
h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.01em;margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);font-size:14px}
.demo-tag{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:4px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.03em;background:none;border:0;color:var(--muted);padding:10px 14px 9px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.step{font-family:var(--body);font-size:11px;font-weight:700;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
button[aria-selected="true"] .step{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.badge-n{font-family:var(--body);font-size:11px;font-weight:700;background:var(--rain);color:var(--surface);border-radius:10px;padding:0 7px}
main .wrap{padding-block:22px 60px;display:flex;flex-direction:column;gap:20px}
.statusbar{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.pill.ok{color:var(--good);background:var(--good-soft);border-color:transparent}
.pill.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.pill.rain{color:var(--rain);background:var(--rain-soft);border-color:transparent}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0;letter-spacing:.01em}
h3{font-family:var(--display);font-weight:600;font-size:18px;margin:0}
.lead{color:var(--muted);margin:0;max-width:68ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.65;font-style:italic}
input.missing{border-color:var(--bad);background:var(--bad-soft)}
.times{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.times select{width:auto}
.tchip{display:inline-flex;align-items:center;gap:2px;font-weight:600;font-size:14px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 4px 3px 10px;font-variant-numeric:tabular-nums}
.tchip .x{border:0;background:none;color:inherit;font-size:16px;line-height:1;cursor:pointer;padding:0 6px;border-radius:50%}
.hdr-actions{display:flex;gap:10px;align-items:center}
.gdxbar{background:#08090c;border-bottom:3px solid var(--accent)}
.gdxbar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.gdxlogo{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.01em;color:#fff;text-decoration:none;line-height:1}
.gdxlogo span{color:var(--accent)}
.gdxsub{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gdxback{color:var(--muted);font-size:14px;text-decoration:none}.gdxback:hover{color:var(--ink);text-decoration:underline}
.gdxbar .spacer{flex:1}

.sharecard{border-color:var(--accent)}
.sharebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tabsep{width:1px;background:var(--line);margin:8px 6px;flex:none}
.pname{display:flex;align-items:center;gap:8px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;flex:none;vertical-align:-2px;border:1px solid var(--line)}
.pc0{background:var(--pc0)}.pc1{background:var(--pc1)}.pc2{background:var(--pc2)}.pc3{background:var(--pc3)}.pc4{background:var(--pc4)}.pc5{background:var(--pc5)}
.pc6{background:var(--pc6)}.pc7{background:var(--pc7)}.pc8{background:var(--pc8)}.pc9{background:var(--pc9)}.pc10{background:var(--pc10)}.pc11{background:var(--pc11)}
table.lu{width:auto;min-width:100%}
table.lu th[scope=row]{font-family:var(--display);font-size:20px;font-weight:700;color:var(--ink);letter-spacing:.02em;padding:4px 12px 4px 4px;width:70px}
table.lu th.inn{font-family:var(--display);font-size:22px;color:var(--ink);text-align:center}
table.lu td{padding:3px}
table.lu tr.benchrow th[scope=row]{color:var(--muted)}
table.lu tr.benchrow:first-of-type td, table.lu tr:not(.benchrow)+tr.benchrow td, table.lu tr:not(.benchrow)+tr.benchrow th{border-top:2px solid var(--muted)}
select.cell{min-width:118px;font-weight:600;font-size:14px;padding:6px 6px;background-color:var(--surface-2)}
select.cell.pc0{background-color:var(--pc0)}select.cell.pc1{background-color:var(--pc1)}select.cell.pc2{background-color:var(--pc2)}select.cell.pc3{background-color:var(--pc3)}select.cell.pc4{background-color:var(--pc4)}select.cell.pc5{background-color:var(--pc5)}select.cell.pc6{background-color:var(--pc6)}select.cell.pc7{background-color:var(--pc7)}select.cell.pc8{background-color:var(--pc8)}select.cell.pc9{background-color:var(--pc9)}select.cell.pc10{background-color:var(--pc10)}select.cell.pc11{background-color:var(--pc11)}
select.cell.dbl{outline:2px solid var(--bad);outline-offset:-2px}
table.chk2 td.c-dbl{background:var(--bad-soft);color:var(--bad);font-weight:700}
table.chk2 td.c-miss{background:var(--warn-soft);color:var(--warn);font-weight:700}
.btn.danger{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.dlist{display:flex;flex-direction:column;gap:10px}
.drow{display:grid;grid-template-columns:minmax(200px,2fr) minmax(130px,1fr) minmax(180px,1.3fr) auto auto;gap:10px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
@media (max-width:820px){.drow{grid-template-columns:1fr 1fr}.drow .f:first-child{grid-column:1/-1}}
table.duties{width:auto;min-width:100%}
table.duties td{padding:3px 6px}
table.duties td.na{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--line) 6px 7px)}
table.duties td.us{font-weight:700}
table.duties th.dname{white-space:normal;min-width:120px;max-width:160px;text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink);vertical-align:bottom;line-height:1.25}
table.duties th.dname span{display:block;color:var(--muted);font-weight:500;margin-top:2px}
table.duties th.side-visitor{background:var(--rain-soft);color:var(--rain)}
table.duties th.side-home{background:var(--accent-soft);color:var(--accent)}
table.duties th.side-both{background:var(--warn-soft);color:var(--warn)}
table.duties tr.pprow td{color:var(--muted)}
table.duties td.unav{min-width:150px}
select.cell.duty{min-width:110px}
select.cell.warnc{outline:2px solid var(--warn);outline-offset:-2px}
.tchip.mini{font-size:12px;padding:1px 2px 1px 8px}
table.fam{width:auto;min-width:min(100%,480px)}
table.umps td input[type=text]{min-width:160px}
table.umps td.wrapc{white-space:normal;max-width:240px;color:var(--muted);font-size:14px}
table.umps tr.uedit td{background:var(--surface)}
table.uass td{vertical-align:top}
table.uass td.t{font-weight:700;font-variant-numeric:tabular-nums}
table.uass td.gm{white-space:normal;min-width:150px}
table.uass tr.fieldhead th{font-family:var(--display);font-size:18px;color:var(--ink);text-transform:none;letter-spacing:.02em;background:var(--surface-2);padding-top:10px}
.crew{display:flex;flex-wrap:wrap;gap:6px}
select.ucell{min-width:170px;max-width:240px}
table.uavail th.num{line-height:1.2;white-space:nowrap}
table.uavail td.num{padding:4px}
.uav{font:inherit;font-weight:700;min-width:46px;min-height:34px;border-radius:8px;border:1px solid var(--line);background:var(--good-soft,var(--accent-soft));color:var(--good,var(--accent));cursor:pointer}
.uav.out{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.uav:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.uoff{display:inline-block;min-width:46px;color:var(--muted);font-size:13px}
.counter.mini{gap:4px}
.counter.mini span{min-width:18px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.counter.mini .btn{font-size:15px;padding:2px 9px}
table.utot td .pill{margin-right:4px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{height:56px;width:auto;max-width:120px;object-fit:contain;flex:none}
.logopick{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logobox{width:84px;height:84px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;background:var(--surface-2);overflow:hidden;flex:none}
.logobox img{max-width:100%;max-height:100%;object-fit:contain}
.logobox span{font-size:12px;color:var(--muted)}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.sumlogo{height:22px;width:auto;vertical-align:middle;margin-right:4px}
@media (max-width:640px){.logo{height:44px}}
.posrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.posrow input[type=text]{padding:4px 8px;font-size:14px}
.sportchip{font-size:14px;padding:5px 10px}
.datesel{display:grid;grid-template-columns:1.2fr .8fr 1fr;gap:6px;min-width:0}
.ngrow .datesel{flex:1 1 220px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.rain{color:var(--rain);border-color:var(--rain)}
.btn.small{font-size:13px;padding:4px 10px}
.btn.link{border:0;background:none;color:var(--muted);padding:4px 6px;text-decoration:underline}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.ed{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.ed .head{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.days{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:3px 8px;cursor:pointer}
.chk input{margin:0;accent-color:var(--accent)}
.cap{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.capbox{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.capbox .big{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.capbox.bad{border-color:var(--bad);background:var(--bad-soft)}
.capbox small{color:var(--muted)}
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th.grp{text-align:center;border-bottom:1px solid var(--line);color:var(--ink)}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num,th.num{text-align:right}
td.hot{color:var(--warn);font-weight:700}
.day{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.dayhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.dayhead strong{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:.02em}
.dayhead .tag{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.game{display:grid;grid-template-columns:78px 72px 86px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.game:last-child{border-bottom:0}
.game .t{font-weight:600}
.game .fld,.game .dv{font-size:13px;color:var(--muted)}
.game .m{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.game .m b{font-weight:600}
.game.pp .m,.game.pp .t{text-decoration:line-through;color:var(--muted)}
.chipst{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:4px}
.chipst.rain{color:var(--rain);background:var(--rain-soft)}
.chipst.new{color:var(--accent);background:var(--accent-soft)}
.weekhead{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:0 6px 6px 0;font-size:14px}
.note.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.note.info{border-left-color:var(--rain);background:var(--rain-soft)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--surface)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.optlink{text-decoration:none;color:inherit}.optlink input{pointer-events:none}.optlink:hover{border-color:var(--accent)}
.opt .k{font-size:12px;color:var(--muted)}
.ppitem{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.ppitem .title{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
pre.msg{white-space:pre-wrap;font-family:var(--body);font-size:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:12px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-weight:600;font-size:14px;z-index:20}
.empty{text-align:left;color:var(--muted);padding:6px 0}
@media (max-width:640px){
  .game{grid-template-columns:70px minmax(0,1fr) auto;row-gap:2px}
  .game .fld,.game .dv{grid-column:2;grid-row:2;display:inline}
  .game .dv{grid-column:1;grid-row:2}
  .game .m{grid-column:2;grid-row:1;white-space:normal}
  .game .act{grid-column:3;grid-row:1/3}
  h1{font-size:26px}
}
.wizard{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px)}
.steps button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;font-size:14px;color:var(--muted);background:none;border:0;border-radius:6px;padding:7px 8px;cursor:pointer}
.steps button:hover{background:var(--surface)}
.steps button.cur{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.steps .dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.steps .done .dot{background:var(--good-soft);color:var(--good);border-color:transparent}
.steps .cur .dot{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.qcard{gap:18px;padding:22px}
.qhead{display:flex;flex-direction:column;gap:6px}
.qhead h2{font-size:28px;text-wrap:balance;line-height:1.15}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.counter{display:inline-flex;align-items:center;gap:6px}
.counter input{width:72px;text-align:center;font-family:var(--display);font-size:20px;font-weight:700;padding:4px}
.counter .btn{font-size:18px;line-height:1;padding:6px 12px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.list.cols{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.choice{display:flex;flex-direction:column;gap:6px}
.opt.dim{opacity:.6;cursor:not-allowed}
.navrow{border-top:1px solid var(--line);padding-top:16px}
.sumgrid{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px}
.sum{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line)}
.sum:last-child{border-bottom:0}

<script id="appScript">
// ===== Tournament engine (no DOM) =====
// Data: T = {name, days:[{date,from,to,kind}], rules:{...},
//   fields:[{id,name,ages:[]}], ages:[{id,name,poolGames,len,turn,nPools,teams:[{id,name,org}],poolOf:{}}],
//   games:[...], seeds:{ageId:{order:[teamIds],notes:[]}}, tieOrder:{ageId:[teamIds]}}
const TDOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function tParseD(s){const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d);}
function tAddDays(s,k){return new Date(tParseD(s)+k*86400000).toISOString().slice(0,10);}
function tDow(s){return new Date(tParseD(s)).getUTCDay();}
function tFmtTime(m){let h=Math.floor(m/60),mi=m%60,ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(mi).padStart(2,'0')+' '+ap;}
function tFmtDate(s){const d=new Date(tParseD(s));return TDOW[d.getUTCDay()]+' '+d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});}

// ---- Pools ----
function tDefaultPools(n,G){return Math.max(1,Math.floor(n/(G+1)));}
function tPools(age){
  const ids=age.teams.filter(t=>t.name.trim()).map(t=>t.id);const G=age.poolGames||2;
  const np=Math.max(1,Math.min(ids.length,age.nPools||tDefaultPools(ids.length,G)));
  const pools=Array.from({length:np},()=>[]);
  // snake by entry order (entry order = strength order, if the director entered it that way)
  ids.forEach((t,i)=>{const r=Math.floor(i/np),k=i%np;const p=age.poolOf&&age.poolOf[t]!=null&&age.poolOf[t]<np?age.poolOf[t]:(r%2?np-1-k:k);pools[p].push(t);});
  return pools;
}
const tPairKey=(a,b)=>a<b?a+'|'+b:b+'|'+a;
function tPoolPairs(ids,G){
  const s=ids.length;if(s<2)return [];
  const arr=ids.slice();if(s%2)arr.push(null);const m=arr.length;const rounds=[];
  for(let r=0;r<m-1;r++){const rd=[];for(let i=0;i<m/2;i++){const a=arr[i],b=arr[m-1-i];if(a&&b)rd.push([a,b]);}rounds.push(rd);arr.splice(1,0,arr.pop());}
  const cnt={};ids.forEach(t=>cnt[t]=0);const played=new Set();const out=[];
  for(let r=0;r<rounds.length;r++){if(ids.every(t=>cnt[t]>=G))break;
    for(const [a,b] of rounds[r]){if(cnt[a]>=G||cnt[b]>=G)continue;out.push({a,b,round:r+1});cnt[a]++;cnt[b]++;played.add(tPairKey(a,b));}}
  let guard=0;
  for(const t of ids){while(cnt[t]<G&&guard++<200){const opts=ids.filter(o=>o!==t&&!played.has(tPairKey(t,o))).sort((x,y)=>cnt[x]-cnt[y]);if(!opts.length)break;const o=opts[0];
    const rd=Math.max(0,...out.map(x=>x.round))+1;out.push({a:t,b:o,round:rd});cnt[t]++;cnt[o]++;played.add(tPairKey(t,o));}}
  return out;
}

// ---- Bracket (everyone advances, seeded 1..N, single elimination) ----
function tSeedOrder(P){let o=[1];while(o.length<P){const n=o.length*2;o=o.flatMap(s=>[s,n+1-s]);}return o;}
function tBracketGames(age,N){
  if(N<2)return [];const P=2**Math.ceil(Math.log2(N));const R=Math.log2(P);const order=tSeedOrder(P);const out=[];let entries=[];
  for(let i=0;i<P;i+=2){const a=order[i],b=order[i+1];
    if(b>N)entries.push({seed:a});else if(a>N)entries.push({seed:b});
    else{const g={id:age.id+'_b1_'+(i/2),age:age.id,phase:'bracket',round:1,R,ra:{seed:a},rb:{seed:b}};out.push(g);entries.push({w:g.id});}}
  for(let r=2;r<=R;r++){const next=[];for(let i=0;i<entries.length;i+=2){const g={id:age.id+'_b'+r+'_'+(i/2),age:age.id,phase:'bracket',round:r,R,ra:entries[i],rb:entries[i+1]};out.push(g);next.push({w:g.id});}entries=next;}
  return out;
}
function tRoundName(g){const k=g.R-g.round;return k===0?'Championship':k===1?'Semifinal':k===2?'Quarterfinal':'Round '+g.round;}
function tIsLong(g){return g.phase==='bracket'&&g.R-g.round<=1&&g.R>=2;}

// ---- Build all games ----
function tBuildGames(T){
  const games=[];
  for(const age of T.ages){
    const pools=tPools(age);const G=age.poolGames||2;
    pools.forEach((ids,pi)=>{const homeCnt={};ids.forEach(t=>homeCnt[t]=0);
      for(const p of tPoolPairs(ids,G)){let h=p.a,a=p.b;if(homeCnt[h]>homeCnt[a]){h=p.b;a=p.a;}homeCnt[h]++;
        games.push({id:age.id+'_p'+pi+'_'+games.length,age:age.id,phase:'pool',pool:pi,round:p.round,home:h,away:a});}});
    const N=age.teams.filter(t=>t.name.trim()).length;
    games.push(...tBracketGames(age,N));
  }
  return games;
}

// ---- Scheduling across shared fields ----
function tSlot(T,g){const age=T.ages.find(a=>a.id===g.age);return (age.len||100)+(age.turn||20)+(tIsLong(g)?(tRules(T).longExtra||0):0);}
function tFieldsFor(T,ageId){const f=T.fields.filter(f=>!f.ages||!f.ages.length||f.ages.includes(ageId));return f;}
// Days: T.days=[{date,from,to,kind:'pool'|'bracket'|'both'}], 1 to 7, in date order.
function tDays(T){
  if(!T.days||!T.days.length){const d=[];if(T.day1||T.times)d.push({date:T.day1||'',from:(T.times&&T.times.d1||{}).from||480,to:(T.times&&T.times.d1||{}).to||1200,kind:'pool'});
    if(T.day2||T.times)d.push({date:T.day2||'',from:(T.times&&T.times.d2||{}).from||480,to:(T.times&&T.times.d2||{}).to||1140,kind:'bracket'});
    T.days=d.length?d:[{date:'',from:480,to:1200,kind:'pool'},{date:'',from:480,to:1140,kind:'bracket'}];delete T.day1;delete T.day2;delete T.times;}
  return T.days;}
const tPoolDay=d=>d.kind==='pool'||d.kind==='both';
const tBrDay=d=>d.kind==='bracket'||d.kind==='both';
function tAbs(T,g){if(g.time==null||!g.date)return null;const i=tDays(T).findIndex(d=>d.date===g.date);return i<0?null:i*1440+g.time;}
function tScheduleSpan(T,list,fixed){
  fixed=fixed||[];const R=tRules(T);const days=tDays(T);
  const fFree={};T.fields.forEach(f=>fFree[f.id]=0);
  const tFree={};const byId={};list.forEach(g=>byId[g.id]=g);
  const perDay={};// pool games per team per day
  const allowed=g=>days.map((d,i)=>i).filter(i=>g.phase==='pool'?tPoolDay(days[i]):tBrDay(days[i]));
  const poolEnd={};// bracket can't start before its age group's pool play ends
  const end=g=>tAbs(T,g)+tSlot(T,g);
  const inList=new Set(list.map(g=>g.id));
  for(const g of fixed.concat(T.games.filter(x=>!inList.has(x.id)))){if(!byId[g.id])byId[g.id]=g;const a=tAbs(T,g);if(a!=null&&g.field&&fFree[g.field]!=null)fFree[g.field]=Math.max(fFree[g.field],a+tSlot(T,g));}
  for(const g of T.games.concat(list)){if(g.phase==='pool'&&tAbs(T,g)!=null)poolEnd[g.age]=Math.max(poolEnd[g.age]||0,end(g));}
  const capOf={};T.ages.forEach(a=>{const n=days.filter(tPoolDay).length||1;capOf[a.id]=Math.ceil((a.poolGames||2)/n);});
  const ready=g=>{let t=0;
    if(g.phase==='pool'){t=Math.max(tFree[g.home]||0,tFree[g.away]||0);}
    else{t=poolEnd[g.age]!=null?poolEnd[g.age]+(R.restBr||0):0;
      for(const r of [g.ra,g.rb]){if(r.w){const f=byId[r.w];if(!f||tAbs(T,f)==null)return null;t=Math.max(t,end(f)+(R.restBr||0));}}}
    return t;};
  // earliest start at or after t on an allowed day, within that day's first game and last start
  const fit=(g,t,capped=true)=>{for(const i of allowed(g)){const d=days[i];if(!d.date)continue;let s=Math.max(t,i*1440+d.from);s=Math.ceil(s/5)*5;if(s>i*1440+d.to)continue;
      if(g.phase==='pool'&&capped){const c=perDay[i]||{};if((c[g.home]||0)>=capOf[g.age]||(c[g.away]||0)>=capOf[g.age])continue;}
      return s;}return capped?fit(g,t,false):null;};
  const ageUse={};const left=new Set(list.map(g=>g.id));const unplaced=[];
  const remainByAge={};list.forEach(g=>remainByAge[g.age]=(remainByAge[g.age]||0)+1);
  while(left.size){let best=null;
    for(const id of left){const g=byId[id];const r=ready(g);if(r==null)continue;
      for(const f of tFieldsFor(T,g.age)){const t=fit(g,Math.max(r,fFree[f.id]));if(t==null)continue;
        const sc=[t,g.round,(ageUse[g.age]&&ageUse[g.age].has(f.id))?0:1,-remainByAge[g.age],T.fields.indexOf(f)];
        if(!best||tLess(sc,best.sc))best={g,f,t,sc};}}
    if(!best){for(const id of left){const g=byId[id];g.time=null;g.field=null;g.date=g.date||'';unplaced.push(g);}break;}
    const {g,f,t}=best;left.delete(g.id);remainByAge[g.age]--;
    const di=Math.floor(t/1440);g.date=days[di].date;g.time=t%1440;g.field=f.id;fFree[f.id]=t+tSlot(T,g);(ageUse[g.age]=ageUse[g.age]||new Set()).add(f.id);
    if(g.phase==='pool'){tFree[g.home]=t+tSlot(T,g)+R.rest;tFree[g.away]=t+tSlot(T,g)+R.rest;const c=perDay[di]=perDay[di]||{};c[g.home]=(c[g.home]||0)+1;c[g.away]=(c[g.away]||0)+1;
      poolEnd[g.age]=Math.max(poolEnd[g.age]||0,t+tSlot(T,g));}
  }
  return unplaced;
}
function tLess(a,b){for(let i=0;i<a.length;i++){if(a[i]<b[i])return true;if(a[i]>b[i])return false;}return false;}
function tSchedule(T){
  tDays(T);const games=tBuildGames(T);const save=T.games;T.games=[];
  const u1=tScheduleSpan(T,games.filter(g=>g.phase==='pool'));
  T.games=games.filter(g=>g.phase==='pool');
  const u2=tScheduleSpan(T,games.filter(g=>g.phase==='bracket'));
  T.games=save;tNumber(T,games);
  return {games,unplaced:[...u1,...u2].map(g=>g.id)};
}
// Re-time bracket games that have no score yet; games already played stay put. Scores are kept.
function tRetimeBracket(T){
  const br=T.games.filter(g=>g.phase==='bracket');const fixed=br.filter(tFinal);const list=br.filter(g=>!tFinal(g));
  list.forEach(g=>{g.time=null;g.field=null;});
  const u=tScheduleSpan(T,list,fixed);
  T.unplaced=(T.unplaced||[]).filter(id=>{const g=T.games.find(x=>x.id===id);return g&&g.phase==='pool';}).concat(u.map(g=>g.id));
  return u.length;
}
function tNumber(T,games){
  const fi=g=>g.field||'';const ab=g=>{const a=tAbs(T,g);return a==null?1e9:a;};
  games.slice().sort((a,b)=>(ab(a)-ab(b))||fi(a).localeCompare(fi(b),undefined,{numeric:true})).forEach((g,i)=>g.num=i+1);
}

// ---- Results ----
function tFinal(g){return !!g.ff||(g.sa!=null&&g.sa!==''&&g.sh!=null&&g.sh!=='');}
// ---- Rules (defaults; the director can change, reorder and save them) ----
const TB_CATALOG={
  rec:{label:'Pool play record',short:'Record'},
  h2h2:{label:'Two teams tied: head to head',short:'Head to head'},
  h2h3:{label:'Three teams tied: a team that beat both others goes first',short:'Beat both'},
  ra:{label:'Fewest runs allowed',short:'Fewest runs allowed'},
  rs:{label:'Most runs scored',short:'Most runs scored'},
  ra1:{label:'Fewest runs allowed, not counting the game with the most allowed',short:'Runs allowed without their worst game'},
  ra2:{label:'Fewest runs allowed, not counting the two games with the most allowed',short:'Runs allowed without their two worst games'},
  inn:{label:'Runs scored inning by inning, starting with the first pool game',short:'Runs inning by inning'},
  poolwin:{label:'Pool finish: pool winners first, then second-place teams, and so on',short:'Pool finish'},
  rd:{label:'Run differential, capped per game',short:'Run differential'},
  rapi:{label:'Fewest runs allowed per defensive inning',short:'Runs allowed per inning'},
  rspi:{label:'Most runs scored per offensive inning',short:'Runs scored per inning'}};
function tRulesDefault(){return {rest:0,restBr:0,longExtra:30,sameOrg:true,tie:'half',ff:'avg',home:'seed',rdCap:8,innings:7,
  tb:['rec','h2h2','h2h3','ra','rs','ra1','ra2','inn','poolwin','rd','rapi','rspi'].map((k,i)=>({k,on:i<8}))};}
function tRules(T){const d=tRulesDefault();const r=Object.assign(d,T.rules||{});
  const have=new Set((r.tb||[]).map(x=>x.k));r.tb=(r.tb||[]).filter(x=>TB_CATALOG[x.k]);for(const x of d.tb)if(!have.has(x.k))r.tb.push({k:x.k,on:false});
  T.rules=r;return r;}
// Average runs a team scored in its other final, non-forfeit pool games
function tAvgRuns(T,team,exceptId){let n=0,r=0;for(const g of T.games){if(g.phase!=='pool'||g.id===exceptId||g.ff||!tFinal(g))continue;if(g.home===team){n++;r+=+g.sh;}else if(g.away===team){n++;r+=+g.sa;}}return n?Math.round(r/n*10)/10:0;}
function tRuns(T,g,home,away){ // {h,a} runs, applying forfeit scoring
  const R=tRules(T);const win=t=>R.ff==='avg'?tAvgRuns(T,t,g.id):(+R.ff||0);
  if(g.ff==='home')return {h:0,a:win(away)};
  if(g.ff==='away')return {h:win(home),a:0};
  return {h:+g.sh,a:+g.sa};
}
function tInnings(T,g){if(g.inn)return +g.inn;if(g.ls){const n=Math.max((g.ls.a||[]).filter(v=>v!==''&&v!=null).length,(g.ls.h||[]).filter(v=>v!==''&&v!=null).length);if(n)return n;}return tRules(T).innings||7;}

// ---- Standings and seeding / tiebreakers ----
function tStats(T,ageId){
  const R=tRules(T);const cap=R.rdCap||0;
  const age=T.ages.find(a=>a.id===ageId);const S={};
  for(const t of age.teams.filter(t=>t.name.trim()))S[t.id]={id:t.id,gp:0,w:0,l:0,t:0,rs:0,ra:0,rd:0,inn:0,games:[],sched:0};
  const ab=g=>{const x=tAbs(T,g);return x==null?1e9:x;};const pg=T.games.filter(g=>g.age===ageId&&g.phase==='pool').sort((a,b)=>ab(a)-ab(b));
  for(const g of pg){if(S[g.home])S[g.home].sched++;if(S[g.away])S[g.away].sched++;if(!tFinal(g))continue;
    const r=tRuns(T,g,g.home,g.away);const inn=tInnings(T,g);
    for(const [me,op,mine,theirs,side] of [[g.home,g.away,r.h,r.a,'h'],[g.away,g.home,r.a,r.h,'a']]){const s=S[me];if(!s)continue;
      s.gp++;s.rs+=mine;s.ra+=theirs;s.inn+=inn;let d=mine-theirs;if(cap)d=Math.max(-cap,Math.min(cap,d));s.rd+=d;
      if(mine>theirs)s.w++;else if(mine<theirs)s.l++;else s.t++;
      s.games.push({g,op,rs:mine,ra:theirs,side});}}
  for(const s of Object.values(S)){
    s.pts=R.tie==='points'?2*s.w+s.t:R.tie==='loss'?s.w:s.w+s.t/2;
    s.pct=R.tie==='points'?s.pts:(s.gp?s.pts/s.gp:0);
    s.rs=Math.round(s.rs*10)/10;s.ra=Math.round(s.ra*10)/10;s.rd=Math.round(s.rd*10)/10;
    s.rapi=s.inn?Math.round(s.ra/s.inn*1000)/1000:0;s.rspi=s.inn?Math.round(s.rs/s.inn*1000)/1000:0;}
  return S;
}
function tH2H(S,a,b){let n=0;for(const x of S[a].games){if(x.op!==b)continue;if(x.rs>x.ra)n++;else if(x.rs<x.ra)n--;}return n;}
function tRaMinus(S,t,k){const v=S[t].games.map(x=>x.ra).sort((a,b)=>b-a);return Math.round((v.slice(k).reduce((p,c)=>p+c,0))*10)/10;}
function tInningSeq(T,S,t){const seq=[];for(const x of S[t].games){const g=x.g;if(g.ff)return null;const ls=g.ls&&g.ls[x.side];if(!ls||!ls.length||ls.every(v=>v===''||v==null))return null;ls.forEach(v=>seq.push(+v||0));}return seq;}
const tPct=p=>p.toFixed(3).replace(/^0/,'');
const tOrd=n=>n+(n%100>=11&&n%100<=13?'th':['th','st','nd','rd'][n%10]||'th');

function tRank(T,ageId){
  const R=tRules(T);const S=tStats(T,ageId);const names={};const age=T.ages.find(a=>a.id===ageId);age.teams.forEach(t=>names[t.id]=t.name);
  const nm=id=>names[id]||'?';const manual=(T.tieOrder||{})[ageId]||[];
  const keys=R.tb.filter(x=>x.on).map(x=>x.k);
  const pools=tPools(age);const poolOf={};pools.forEach((p,i)=>p.forEach(t=>poolOf[t]=i));
  const place={};
  function run(ids,ks,why,need){
    const num=k=>ks.indexOf(k)+1;
    const VAL={rec:t=>S[t].pct,ra:t=>-S[t].ra,rs:t=>S[t].rs,ra1:t=>-tRaMinus(S,t,1),ra2:t=>-tRaMinus(S,t,2),
      poolwin:t=>-(place[t]||99),rd:t=>S[t].rd,rapi:t=>-S[t].rapi,rspi:t=>S[t].rspi};
    const SHOW={ra:t=>S[t].ra,rs:t=>S[t].rs,ra1:t=>tRaMinus(S,t,1),ra2:t=>tRaMinus(S,t,2),poolwin:t=>`${tOrd(place[t]||0)} in Pool ${'ABCDEFGHIJKL'[poolOf[t]]}`,
      rd:t=>(S[t].rd>0?'+':'')+S[t].rd,rapi:t=>S[t].rapi.toFixed(2),rspi:t=>S[t].rspi.toFixed(2)};
    function brk(ids){
      if(ids.length<=1)return ids;
      if(ids.every(t=>S[t].gp===0))return ids;
      let missing=false;
      for(const k of ks){
        if(k==='h2h2'){if(ids.length!==2)continue;const [a,b]=ids;const h=tH2H(S,a,b);if(!h)continue;const w=h>0?a:b,l=h>0?b:a;
          why[w]=`Beat ${nm(l)} head to head (rule ${num(k)})`;why[l]=`Lost to ${nm(w)} head to head (rule ${num(k)})`;return [w,l];}
        if(k==='h2h3'){if(ids.length!==3)continue;const sw=ids.find(t=>ids.every(o=>o===t||tH2H(S,t,o)>0));if(!sw)continue;
          why[sw]=`Beat both ${ids.filter(o=>o!==sw).map(nm).join(' and ')} (rule ${num(k)})`;return [sw,...brk(ids.filter(o=>o!==sw))];}
        if(k==='inn'){const seqs=ids.map(t=>tInningSeq(T,S,t));if(!seqs.every(Boolean)){missing=true;continue;}
          const L=Math.max(...seqs.map(s=>s.length));const cum=ids.map(()=>0);
          for(let i=0;i<L;i++){ids.forEach((t,j)=>cum[j]+=seqs[j][i]||0);const top=Math.max(...cum);if(!cum.every(v=>v===top)){
            const lead=ids.filter((t,j)=>cum[j]===top),rest=ids.filter((t,j)=>cum[j]!==top);
            lead.forEach(t=>why[t]=`More runs inning by inning, ahead after inning ${i+1} of pool play (rule ${num(k)})`);
            rest.forEach(t=>why[t]=`Fewer runs inning by inning (rule ${num(k)})`);
            return [...brk(lead),...brk(rest)];}}
          continue;}
        const f=VAL[k];if(!f)continue;const vals=ids.map(f);if(vals.every(v=>v===vals[0]))continue;
        const distinct=[...new Set(vals)].sort((x,y)=>y-x);const groups=distinct.map(v=>ids.filter(t=>f(t)===v));
        if(k!=='rec')ids.forEach(t=>why[t]=`${TB_CATALOG[k].short}: ${SHOW[k](t)} (rule ${num(k)})`);
        return groups.flatMap(g=>brk(g));
      }
      const decided=ids.every(t=>manual.includes(t));
      need.push({ids:ids.slice(),missing,decided});
      const sorted=ids.slice().sort((x,y)=>{const ix=manual.indexOf(x),iy=manual.indexOf(y);return (ix<0?999:ix)-(iy<0?999:iy);});
      sorted.forEach(t=>why[t]=decided?'Still tied after every tiebreaker; placed by coin flip':`Still tied${missing?'; the inning-by-inning rule needs line scores':' after every tiebreaker'}`);
      return sorted;
    }
    return brk(ids);
  }
  if(keys.includes('poolwin')){const ks=keys.filter(k=>k!=='poolwin');for(const p of pools){const o=run(p,ks,{},[]);o.forEach((t,i)=>place[t]=i+1);}}
  const why={},need=[];
  const order=run(Object.keys(S),keys,why,need);
  return {order,S,why,need,place};
}

// Same-organization rule: no first-round matchup between teams of one organization (brackets of 8+)
function tFixOrgs(T,age,order){
  const N=order.length;const notes=[];if(N<8||!tRules(T).sameOrg)return {order,notes};
  const org=id=>((age.teams.find(t=>t.id===id)||{}).org||'').trim().toLowerCase();
  const pairs=tBracketGames(age,N).filter(g=>g.round===1).map(g=>[g.ra.seed,g.rb.seed]);
  const bad=o=>pairs.filter(([a,b])=>org(o[a-1])&&org(o[a-1])===org(o[b-1]));
  let o=order.slice();
  for(let guard=0;guard<10;guard++){const c=bad(o);if(!c.length)break;const [a,b]=c[0];let fixed=false;
    for(const d of [1,-1,2,-2,3,-3]){const s=b+d;if(s<1||s>N||s===a)continue;const t=o.slice();[t[b-1],t[s-1]]=[t[s-1],t[b-1]];
      if(bad(t).length<c.length){notes.push(`Seeds ${Math.min(b,s)} and ${Math.max(b,s)} were swapped so two ${(age.teams.find(x=>x.id===o[b-1])||{}).org} teams don't meet in their first game`);o=t;fixed=true;break;}}
    if(!fixed){notes.push('Two teams from one organization meet in a first-round game; no nearby seed swap avoids it.');break;}}
  return {order:o,notes};
}

// ---- Bracket resolution ----
function tSeedTeam(T,ageId,k){const s=(T.seeds||{})[ageId];return s&&s.order[k-1]||null;}
function tSeedOf(T,ageId,team){const s=(T.seeds||{})[ageId];return s?s.order.indexOf(team)+1:0;}
function tTeamOfRef(T,g,ref){if(ref.seed)return tSeedTeam(T,g.age,ref.seed);const f=T.games.find(x=>x.id===ref.w);return f?tWinner(T,f):null;}
function tSides(T,g){ // {home,away} team ids (or null) for any game
  if(g.phase==='pool')return {home:g.home,away:g.away};
  const x=tTeamOfRef(T,g,g.ra),y=tTeamOfRef(T,g,g.rb);
  if(x&&y){if(tRules(T).home==='flip')return g.homeSide==='b'?{home:y,away:x}:{home:x,away:y};const sx=tSeedOf(T,g.age,x),sy=tSeedOf(T,g.age,y);return sx<sy?{home:x,away:y}:{home:y,away:x};}
  return {home:x,away:y};
}
function tWinner(T,g){if(!tFinal(g))return null;const s=tSides(T,g);if(!s.home||!s.away)return null;const r=tRuns(T,g,s.home,s.away);if(r.h===r.a)return null;return r.h>r.a?s.home:s.away;}

// ---- Checks: team double booked, field overlap, rest ----
function tCheck(T){
  const out=[];const placed=T.games.filter(g=>g.time!=null);
  for(let i=0;i<placed.length;i++)for(let j=i+1;j<placed.length;j++){const a=placed[i],b=placed[j];if(a.date!==b.date)continue;
    const ov=a.time<b.time+tSlot(T,b)&&b.time<a.time+tSlot(T,a);if(!ov)continue;
    if(a.field===b.field)out.push(`Game ${a.num} and Game ${b.num} overlap on the same field`);
    const sa=tSides(T,a),sb=tSides(T,b);const ta=[sa.home,sa.away].filter(Boolean),tb=[sb.home,sb.away].filter(Boolean);
    const both=ta.filter(t=>tb.includes(t));if(both.length)out.push(`Game ${a.num} and Game ${b.num} overlap for the same team`);}
  for(const g of T.games.filter(g=>g.phase==='bracket'&&g.time!=null))for(const r of [g.ra,g.rb])if(r.w){const f=T.games.find(x=>x.id===r.w);if(f&&tAbs(T,f)!=null&&tAbs(T,g)!=null&&tAbs(T,f)+tSlot(T,f)>tAbs(T,g))out.push(`Game ${g.num} starts before Game ${f.num} (its feeder) is due to finish`);}
  return out;
}

      <label class="f">Time limit${minSel('al'+i,a.len||100,[60,75,90,100,105,110,120,135,150],`data-alen="${i}"`,fmtMin)}</label>
      <label class="f">Between games${minSel('at'+i,a.turn==null?20:a.turn,[0,10,15,20,25,30,40],`data-aturn="${i}"`,fmtMin)}</label>
      <label class="f">Teams${countInput('nt'+i,a.teams.length,0,32,'Number of teams')}</label></div>
      ${a.teams.length?`<div class="teamgrid">${a.teams.map((t,j)=>`<div class="teamrow"><span class="n">${j+1}</span><input type="text" id="tn${i}_${j}" data-tn="${i}|${j}" value="${esc(t.name)}" placeholder="Team ${j+1}" aria-label="${esc(a.name||'Age group')} team ${j+1} name"><input type="text" id="to${i}_${j}" data-to="${i}|${j}" value="${esc(t.org)}" placeholder="Organization" aria-label="Team ${j+1} organization">${t.name.trim()&&np>1?`<select id="tp${i}_${j}" data-tp="${i}|${t.id}" aria-label="Pool for ${esc(t.name)}">${pools.map((p,k)=>`<option value="${k}" ${p.includes(t.id)?'selected':''}>Pool ${POOLS[k]}</option>`).join('')}</select>`:'<span></span>'}</div>`).join('')}</div>`:''}
      ${n>=2?`<div class="row"><span class="f" style="font-size:13px;font-weight:600;color:var(--muted)">Pools</span>${countInput('np'+i,np,1,Math.max(1,Math.floor(n/2)),'Number of pools')}<span class="sub">Suggested: ${tDefaultPools(n,G)} for ${n} teams playing ${G} pool game${G===1?'':'s'}.</span>${a.poolOf&&Object.keys(a.poolOf).length?`<button class="btn link small" data-act="poolReset" data-i="${i}">Reset pools</button>`:''}</div>
      <div class="pools">${pools.map((p,k)=>{const games=tPoolPairs(p,G).length;const short=p.length<G+1;return `<div class="pool"><h4>Pool ${POOLS[k]} <span class="sub">· ${games} games</span></h4><ol>${p.map(id=>`<li>${esc(teamName(id))}</li>`).join('')}</ol>${short?`<p class="sub" style="margin:4px 0 0;color:var(--warn)">Too small for ${G} games each</p>`:''}</div>`;}).join('')}</div>`:''}
    </div>`;});
  h+=`</section>`;
  // fields
  h+=`<section class="card"><div class="row"><div><span class="secnum">Step 3</span><h2>Fields</h2></div><span class="spacer"></span><label class="f" style="flex-direction:row;align-items:center;gap:8px">Fields${countInput('nFld',T.fields.length,0,24,'Number of fields')}</label></div>
    <p class="lead">Check the age groups each field can host, for example by base distance. Leave all unchecked if any age group can play there.</p>
    ${T.fields.length?`<div>${T.fields.map((f,i)=>`<div class="fieldrow"><input type="text" id="fn${i}" data-fn="${i}" value="${esc(f.name)}" placeholder="Field ${i+1}" class="${showErr&&!f.name.trim()?'missing':''}" aria-label="Field ${i+1} name"><div class="days">${T.ages.map(a=>`<label class="chk"><input type="checkbox" id="fa${i}_${a.id}" data-fa="${i}" value="${a.id}" ${f.ages.includes(a.id)?'checked':''}>${esc(a.name||'Age group')}</label>`).join('')||'<span class="sub">Add age groups first</span>'}${T.ages.length&&!f.ages.length?'<span class="sub">Any age group</span>':''}</div></div>`).join('')}</div>`:'<p class="empty">Add your fields.</p>'}
  </section>`;
  // rules
  h+=`<section class="card"><span class="secnum">Step 4</span><h2>Rules</h2>
    <div class="grid2"><label class="f">Shortest break between a team's games, pool play${minSel('rRest',tRules(T).rest,[0,15,30,45,60,90,120,150,180],'data-rule="rest"',v=>v?fmtMin(v):'None: next game as soon as a field is free')}</label>
      <label class="f">Shortest break between a team's games, bracket play${minSel('rRestBr',tRules(T).restBr||0,[0,15,30,45,60,90,120],'data-rule="restBr"',v=>v?fmtMin(v):'None: next game as soon as a field is free')}</label>
      <label class="f">Extra time for semifinals and championship (no time limit)${minSel('rLong',tRules(T).longExtra,[0,15,30,45,60],'data-rule="longExtra"',fmtMin)}</label></div>
    <label class="chk" style="align-self:flex-start"><input type="checkbox" id="rOrg" data-rule="sameOrg" ${tRules(T).sameOrg?'checked':''}>Keep two teams from one organization apart in their first bracket game (brackets of 8 or more)</label>
    ${renderRules()}
  </section>`;
  const errs=setupErrors();
  h+=`<section class="card"><h2>Build the weekend</h2>
    ${showErr&&errs.length?`<div class="note bad"><b>Before building:</b><ul style="margin:6px 0 0;padding-left:20px">${errs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    ${T.built&&T.stale?'<div class="note">The setup changed since the schedule was built. Rebuild to use the changes.</div>':''}
    ${T.built&&confirmBuild?`<div class="note bad">Rebuilding replaces the schedule${T.games.some(tFinal)?' and erases the scores already entered':''}. Click again to rebuild.</div>`:''}
    <div class="row"><button class="btn primary" data-act="build">${T.built?(confirmBuild?'Click again to rebuild':'Rebuild the schedule'):'Build the schedule'}</button>${confirmBuild?'<button class="btn link small" data-act="cancelBuild">Cancel</button>':''}${T.built?'<button class="btn" data-act="goSchedule">See the schedule</button>':''}</div></section>`;
  return h;
}


function tbDesc(k,R){if(k==='rec')return R.tie==='points'?'Pool play points (win 2, tie 1, loss 0)':R.tie==='loss'?'Pool play record (winning percentage; a tie counts as a loss)':'Pool play record (winning percentage; a tie counts as half a win and half a loss)';
  if(k==='rd')return `Run differential, capped at ±${R.rdCap||'no cap'} per game`;if(k==='h2h3')return 'Three teams tied: a team that beat both others goes first';return TB_CATALOG[k].label;}
function isDefaultRules(R){return JSON.stringify(pickRules(R))===JSON.stringify(pickRules(tRulesDefault()));}
function renderRules(){const R=tRules(T);const sets=ruleSets();const names=Object.keys(sets).sort();let n=0;
  return `<div class="rulesbox"><div class="row"><h3>Seeding and tiebreakers</h3><span class="spacer"></span>${isDefaultRules(R)?'<span class="pill">Default rules</span>':'<span class="pill warn">Changed from the default</span><button class="btn link small" data-act="rulesDefault">Reset to default</button>'}</div>
    <p class="lead">All teams in an age group are seeded together, across pools. The rules run top to bottom until the tie is broken. Turn a rule off, move it with the arrows, or turn on another one.</p>
    <ol class="tblist">${R.tb.map((x,i)=>{if(x.on)n++;return `<li class="tbrow ${x.on?'':'off'}"><span class="tbn">${x.on?n:''}</span><label class="tbchk"><input type="checkbox" id="tb_${x.k}" data-tbon="${i}" ${x.on?'checked':''}><span>${esc(tbDesc(x.k,R))}${x.k==='inn'?'<span class="sub"> · needs runs by inning; asked for only when a tie gets this far</span>':''}</span></label>
      ${x.k==='rd'&&x.on?minSel('rdCap',R.rdCap,[0,5,6,7,8,10,12,15],'data-rule="rdCap"',v=>v?'Cap ±'+v:'No cap'):''}${(x.k==='rapi'||x.k==='rspi')&&x.on?minSel('inn_'+x.k,R.innings,[4,5,6,7,9],'data-rule="innings"',v=>v+' innings a game'):''}
      <span class="tbmv"><button class="btn small" data-act="tbUp" data-i="${i}" ${i===0?'disabled':''} aria-label="Move up">↑</button><button class="btn small" data-act="tbDown" data-i="${i}" ${i===R.tb.length-1?'disabled':''} aria-label="Move down">↓</button></span></li>`;}).join('')}</ol>
    <p class="sub" style="margin:0">If every rule is used up and teams are still tied, you decide by coin flip on Pool standings.${R.tb.some(x=>x.on&&(x.k==='rapi'||x.k==='rspi'))?' Per-inning rules use each game\'s innings, typed on the schedule, or the regulation innings above.':''}</p>
    <div class="grid2"><label class="f">A tie game counts as<select id="rTie" data-rules="tie"><option value="half" ${R.tie==='half'?'selected':''}>Half a win and half a loss</option><option value="points" ${R.tie==='points'?'selected':''}>Points: win 2, tie 1, loss 0</option><option value="loss" ${R.tie==='loss'?'selected':''}>A loss</option></select></label>
      <label class="f">Forfeit score<select id="rFf" data-rules="ff">${[['avg',"Winner's average runs to 0"],['5','5 to 0'],['6','6 to 0'],['7','7 to 0'],['8','8 to 0'],['10','10 to 0']].map(([v,t])=>`<option value="${v}" ${String(R.ff)===v?'selected':''}>${t}</option>`).join('')}</select></label>
      <label class="f">Home team in the bracket<select id="rHome" data-rules="home"><option value="seed" ${R.home==='seed'?'selected':''}>Higher seed</option><option value="flip" ${R.home==='flip'?'selected':''}>Coin flip, set game by game</option></select></label></div>
    <div class="rsets"><h3>Rule sets</h3><p class="sub" style="margin:0">Save these rules by name to use them again at your next tournament. Rule sets are kept in this browser.</p>
      <div class="row"><input type="text" id="rsName" value="${esc(rsName)}" placeholder="Name this rule set, like Spring rules" style="flex:1 1 220px;width:auto"><button class="btn" data-act="rsSave">Save rule set</button></div>
      ${names.length?`<div class="row"><select id="rsPick" style="flex:1 1 220px;width:auto">${names.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select><button class="btn" data-act="rsUse">Use this rule set</button><button class="btn link small" data-act="rsDel">Delete it</button></div>`:''}</div></div>`;}

// ===== Schedule and scores =====
function gTeams(g){const s=tSides(T,g);const lab=(ref)=>{if(!ref)return '';if(ref.seed)return `Seed ${ref.seed}`;const f=T.games.find(x=>x.id===ref.w);return f?`Winner of Game ${f.num}`:'?';};
  if(g.phase==='pool')return {home:s.home,away:s.away,hl:teamName(s.home),al:teamName(s.away)};
  const x=tTeamOfRef(T,g,g.ra),y=tTeamOfRef(T,g,g.rb);
  if(x&&y)return {home:s.home,away:s.away,hl:seedLabel(g.age,s.home),al:seedLabel(g.age,s.away)};
  // unresolved: list in bracket order (ra first) as placeholders
  return {home:null,away:null,hl:x?seedLabel(g.age,x):lab(g.ra),al:y?seedLabel(g.age,y):lab(g.rb),pending:true};}
function usesInnings(){return tRules(T).tb.some(x=>x.on&&(x.k==='rapi'||x.k==='rspi'));}
function seedLabel(ageId,team){const s=tSeedOf(T,ageId,team);return (s?`(${s}) `:'')+teamName(team);}
function roundLabel(g){return g.phase==='pool'?`Pool ${POOLS[g.pool]}`:tRoundName(g);}
function scoreRow(g){
  const tt=gTeams(g);const fin=tFinal(g);const ready=!tt.pending;
  const r=fin&&ready?tRuns(T,g,tt.home,tt.away):null;const win=r&&r.h!==r.a?(r.h>r.a?'h':'a'):'';
  const inp=(side,val)=>ready?`<input type="number" inputmode="numeric" min="0" class="sc" id="sc_${g.id}_${side}" data-sc="${g.id}|${side}" value="${val==null?'':esc(val)}" aria-label="${side==='a'?'Visitor':'Home'} runs, Game ${g.num}" ${g.ff?'disabled':''}>`:'';
  const line=(side,label,nmv)=>`<div class="tm ${win===side?'win':''}"><span class="ha">${side==='a'?'Vis':'Home'}</span>${inp(side,g.ff?(side==='a'?r&&r.a:r&&r.h):(side==='a'?g.sa:g.sh))}<span class="nm ${ready?'':'ph'}">${esc(nmv)}</span></div>`;
  const tie=fin&&ready&&g.phase==='bracket'&&r&&r.h===r.a;
  let h=`<div class="tgame ${fin?'final':''}" id="g_${g.id}"><span class="gn">Game ${g.num}</span><span class="t">${g.time!=null?tFmtTime(g.time):'Not placed'}</span><span class="fld">${esc(fieldName(g.field))}</span><span class="ag">${esc(ageOf(g.age).name)}</span>
    <div class="m"><span class="rd ${g.phase==='bracket'?'br':''}">${esc(roundLabel(g))}</span>${line('a','Visitor',tt.al)}${line('h','Home',tt.hl)}${tie?'<span class="pill bad">Bracket games can\'t end tied</span>':''}${g.ff?`<span class="sub">${esc(teamName(g.ff==='home'?tt.home:tt.away))} forfeited</span>`:''}</div>
    <div class="acts">${ready&&usesInnings()&&g.phase==='pool'?`<label class="sub" style="display:flex;gap:4px;align-items:center">Innings<input type="number" min="1" max="15" class="sc" style="width:46px!important" id="gi_${g.id}" data-ginn="${g.id}" value="${g.inn||''}" placeholder="${tRules(T).innings}"></label>`:''}${ready&&g.phase==='bracket'&&tRules(T).home==='flip'&&!fin?`<button class="btn link small" data-act="swapHome" data-g="${g.id}">Switch home team</button>`:''}${ready?`<button class="btn link small" data-act="ls" data-g="${g.id}">${lsOpen===g.id?'Close':'Line score'}${g.ls?' ✓':''}</button><select id="ff_${g.id}" data-ff="${g.id}" aria-label="Forfeit, Game ${g.num}" style="width:auto;font-size:13px;padding:3px 6px"><option value="">No forfeit</option><option value="away" ${g.ff==='away'?'selected':''}>Visitor forfeits</option><option value="home" ${g.ff==='home'?'selected':''}>Home forfeits</option></select>`:''}<button class="btn link small" data-act="mv" data-g="${g.id}">${mvOpen===g.id?'Close':'Move'}</button></div>`;
  if(lsOpen===g.id&&ready){const ls=g.ls||{a:[],h:[]};const n=Math.max(7,ls.a.length,ls.h.length);
    h+=`<div class="lsbox"><div class="scroll"><table><thead><tr><th>Team</th>${Array.from({length:n},(_,i)=>`<th>${i+1}</th>`).join('')}<th>R</th></tr></thead><tbody>
      ${[['a',tt.al],['h',tt.hl]].map(([s,nm])=>`<tr><td>${esc(nm)}</td>${Array.from({length:n},(_,i)=>`<td><input type="number" min="0" inputmode="numeric" id="li_${g.id}_${s}_${i}" data-li="${g.id}|${s}|${i}" value="${ls[s][i]==null?'':ls[s][i]}" aria-label="${esc(nm)} inning ${i+1}"></td>`).join('')}<td><b>${(ls[s]||[]).reduce((p,c)=>p+(+c||0),0)}</b></td></tr>`).join('')}</tbody></table></div>
      <div class="row"><button class="btn small" data-act="lsMore" data-g="${g.id}">Add an inning</button><span class="sub">Runs by inning are only needed for the inning-by-inning tiebreaker. The totals fill the score.</span></div></div>`;}
  if(mvOpen===g.id){const di=Math.max(0,T.days.findIndex(d=>d.date===g.date));const day=T.days[di]||{from:480};const okDays=T.days.map((d,i)=>i).filter(i=>g.phase==='pool'?tPoolDay(T.days[i]):tBrDay(T.days[i]));
    h+=`<div class="lsbox"><div class="row">${T.days.length>1?`<label class="f">Day<select id="md_${g.id}" data-md="${g.id}">${okDays.map(i=>`<option value="${T.days[i].date}" ${T.days[i].date===g.date?'selected':''}>Day ${i+1} · ${T.days[i].date?tFmtDate(T.days[i].date):'no date'}</option>`).join('')}</select></label>`:''}<label class="f">Field<select id="mf_${g.id}" data-mf="${g.id}">${tFieldsFor(T,g.age).map(f=>`<option value="${f.id}" ${f.id===g.field?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label>
      <label class="f">Start${timeSel('mt_'+g.id,g.time,Math.min(day.from,360),1320,5,`data-mt="${g.id}"`)}</label></div><p class="sub" style="margin:0">Any overlap this creates is flagged at the top of the schedule.</p></div>`;}
  return h+`</div>`;
}
function renderSchedule(){
  if(!T.built)return `<section class="card"><h2>Schedule and scores</h2><p class="lead">Finish setup and build the schedule first.</p><div><button class="btn primary" data-act="goSetup">Go to setup</button></div></section>`;
  const issues=tCheck(T);const pool=T.games.filter(g=>g.phase==='pool');const done=pool.filter(tFinal).length;
  let h=`<section class="card"><div class="row"><h2>Schedule and scores</h2><span class="spacer"></span><button class="btn small" data-act="copyTsv">Copy for Excel or Google Sheets</button></div>
    <div class="statusbar"><span class="pill ${done===pool.length?'ok':''}">${done} of ${pool.length} pool games final</span>
    ${T.unplaced.length?`<span class="pill bad">${T.unplaced.length} game${T.unplaced.length===1?'':'s'} didn't fit: ${T.unplaced.map(id=>{const g=T.games.find(x=>x.id===id);return g?'Game '+g.num:'';}).join(', ')}</span>`:'<span class="pill ok">Every game has a time and field</span>'}
    ${issues.length?issues.map(x=>`<span class="pill bad">${esc(x)}</span>`).join(''):''}
    ${T.stale?'<span class="pill warn">Setup changed since this schedule was built</span>':''}</div>
    <div class="row">${T.days.length>1?`<label class="f">Day<select id="fDay"><option value="all">All days</option>${T.days.map((d,i)=>`<option value="${d.date}" ${fDay===d.date?'selected':''}>Day ${i+1} · ${d.date?tFmtDate(d.date):''}</option>`).join('')}</select></label>`:''}
      <label class="f">Age group<select id="fAge"><option value="all">All age groups</option>${T.ages.map(a=>`<option value="${a.id}" ${fAge===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label></div>
    ${T.unplaced.length||T.stale?`<div class="row"><button class="btn primary" data-act="retime">Re-time the bracket</button><span class="sub">Fits the bracket games that have no score yet into the bracket days using the current fields, times and breaks. Scores are kept and games already played stay put.${T.unplaced.some(id=>{const g=T.games.find(x=>x.id===id);return g&&g.phase==='pool';})?' Pool games that didn\'t fit need a later last start or another field, then a rebuild, or use Move.':''}</span></div>`:''}
    <p class="sub" style="margin:0">Type each team's runs when a game ends. Standings, seeds and the bracket update by themselves.</p></section>`;
  const KIND={pool:'Pool play',bracket:'Bracket',both:'Pool play, then bracket'};
  T.days.forEach((d,i)=>{if(fDay!=='all'&&fDay!==d.date)return;
    const list=T.games.filter(g=>g.date===d.date&&g.time!=null&&(fAge==='all'||g.age===fAge)).sort((a,b)=>a.num-b.num);if(!list.length)return;
    h+=`<div class="day"><div class="dayhead"><strong>${tFmtDate(d.date)}</strong><span class="tag">Day ${i+1} · ${KIND[d.kind]}</span></div>${list.map(scoreRow).join('')}</div>`;});
  {const list=T.games.filter(g=>g.time==null&&(fAge==='all'||g.age===fAge)).sort((a,b)=>a.num-b.num);
    if(list.length&&fDay==='all')h+=`<div class="day"><div class="dayhead"><strong>Not placed yet</strong><span class="tag">Use Move or Re-time the bracket</span></div>${list.map(scoreRow).join('')}</div>`;}
  return h;
}

// ===== Standings and seeding =====
function seededOrderFor(ageId){const R=tRank(T,ageId);const a=ageOf(ageId);return {R,fix:tFixOrgs(T,a,R.order)};}
function bracketScored(ageId){return T.games.some(g=>g.age===ageId&&g.phase==='bracket'&&tFinal(g));}
const ptsHead=()=>tRules(T).tie==='points'?'Pts':'Pct';const ptsVal=s=>tRules(T).tie==='points'?s.pts:tPct(s.pct);const rdOn=()=>tRules(T).tb.some(x=>x.on&&x.k==='rd');
function renderStand(){
  if(!T.built)return `<section class="card"><h2>Pool standings</h2><p class="lead">Build the schedule first.</p><div><button class="btn primary" data-act="goSetup">Go to setup</button></div></section>`;
  let h=`<section class="card"><div class="row"><h2>Pool standings and seeds</h2><span class="spacer"></span><label class="f" style="flex-direction:row;align-items:center;gap:8px">Age group<select id="fAge2"><option value="all">All</option>${T.ages.map(a=>`<option value="${a.id}" ${fAge===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label></div>
    <p class="lead">Seeds follow this tournament's rules in order: ${tRules(T).tb.filter(x=>x.on).map((x,i)=>`${i+1}. ${esc(TB_CATALOG[x.k].short.toLowerCase())}`).join('; ')}. Change them in Setup, step 4. When the pool games are done, press <b>Seed the bracket</b>.</p></section>`;
  for(const a of T.ages){if(fAge!=='all'&&fAge!==a.id)continue;
    const {R,fix}=seededOrderFor(a.id);const S=R.S;const pg=T.games.filter(g=>g.age===a.id&&g.phase==='pool');const done=pg.filter(tFinal).length;
    const pools=tPools(a);const rec=s=>`${s.w}-${s.l}${s.t?'-'+s.t:''}`;
    const cur=(T.seeds||{})[a.id];const changed=cur&&cur.order.join()!==fix.order.join();const scored=bracketScored(a.id);
    h+=`<section class="card"><div class="row"><h2>${esc(a.name)}</h2><span class="pill ${done===pg.length?'ok':''}">${done} of ${pg.length} pool games final</span>${cur?`<span class="pill ok">Bracket seeded</span>`:''}</div>
      <div class="pools" style="grid-template-columns:repeat(auto-fill,minmax(330px,1fr))">${pools.map((p,k)=>`<div class="pool"><h4>Pool ${POOLS[k]}</h4><div class="scroll"><table class="stand"><thead><tr><th></th><th>Team</th><th class="num">W-L-T</th><th class="num">${ptsHead()}</th><th class="num">RS</th><th class="num">RA</th></tr></thead><tbody>
        ${p.slice().sort((x,y)=>R.order.indexOf(x)-R.order.indexOf(y)).map(id=>{const s=S[id];return `<tr><td class="sub">${R.order.indexOf(id)+1}</td><td>${esc(teamName(id))}</td><td class="num">${rec(s)}</td><td class="num">${ptsVal(s)}</td><td class="num">${s.rs}</td><td class="num">${s.ra}</td></tr>`;}).join('')}</tbody></table></div></div>`).join('')}</div>`;
    // ties needing decisions
    const allFinal=ids=>pg.filter(g=>ids.includes(g.home)||ids.includes(g.away)).every(tFinal);
    for(const n of R.need.filter(n=>allFinal(n.ids))){const man=(T.tieOrder[a.id]||[]);const names=n.ids.map(teamName);
      h+=`<div class="tiebox"><b>${esc(names.join(', '))} are still tied${n.missing?'':' after every tiebreaker'}.</b>
        ${n.missing?`<span>The inning-by-inning rule needs runs by inning for their pool games: ${pg.filter(g=>n.ids.includes(g.home)||n.ids.includes(g.away)).filter(g=>!g.ls).map(g=>`<button class="btn link small" data-act="openLs" data-g="${g.id}">Game ${g.num}</button>`).join(' ')}. Or decide by coin flip below.</span>`:'<span>No rule separates them. Decide by coin flip.</span>'}
        <div class="row"><span class="sub">Coin flip, pick who goes ahead${n.ids.length>2?', in order':''}:</span>${n.ids.filter(t=>!man.includes(t)).map(t=>`<button class="btn small" data-act="flip" data-a="${a.id}" data-t="${t}" data-grp="${n.ids.join(',')}">${esc(teamName(t))}</button>`).join('')}${n.ids.some(t=>man.includes(t))?`<button class="btn link small" data-act="flipReset" data-a="${a.id}" data-grp="${n.ids.join(',')}">Start over</button>`:''}</div></div>`;}
    h+=`<h3>Bracket seeds${cur?'':' (as of now)'}</h3>
      <div class="scroll"><table class="seedt"><thead><tr><th>Seed</th><th>Team</th><th>Pool</th><th class="num">W-L-T</th><th class="num">${ptsHead()}</th><th class="num">RA</th><th class="num">RS</th>${rdOn()?'<th class="num">RD</th>':''}<th>How the tie was broken</th></tr></thead><tbody>
      ${(cur&&!changed?cur.order:fix.order).map((id,i)=>{const s=S[id];const pk=pools.findIndex(p=>p.includes(id));return `<tr><td class="sd">${i+1}</td><td>${esc(teamName(id))}${(ageOf(a.id).teams.find(t=>t.id===id)||{}).org?` <span class="sub">· ${esc(ageOf(a.id).teams.find(t=>t.id===id).org)}</span>`:''}</td><td>${pk>=0?POOLS[pk]:''}</td><td class="num">${rec(s)}</td><td class="num">${ptsVal(s)}</td><td class="num">${s.ra}</td><td class="num">${s.rs}</td>${rdOn()?`<td class="num">${s.rd>0?'+':''}${s.rd}</td>`:''}<td class="why">${esc(R.why[id]||'')}</td></tr>`;}).join('')}</tbody></table></div>
      ${fix.notes.length?`<div class="note info">${fix.notes.map(esc).join('<br>')}</div>`:''}
      ${cur&&changed?`<div class="note">Scores changed after the bracket was seeded, so the seeds above differ from the bracket. ${scored?'Bracket games already have scores, so the bracket stays as seeded.':''}</div>`:''}
      <div class="row">${!cur||(changed&&!scored)?`<button class="btn primary" data-act="seed" data-a="${a.id}">${confirmSeed===a.id?'Click again to seed now':cur?'Re-seed the bracket':'Seed the bracket'}</button>`:''}
        ${confirmSeed===a.id?`<span class="sub" style="color:var(--warn)">${pg.length-done} pool game${pg.length-done===1?' is':'s are'} not final. Seeding now uses the games played so far.</span>`:''}
        ${cur&&!scored?`<button class="btn link small" data-act="unseed" data-a="${a.id}">Undo seeding</button>`:''}
        ${R.need.some(n=>!n.decided)?'<span class="sub" style="color:var(--warn)">Settle the ties above first, or seeds for those teams follow the order they were entered.</span>':''}</div>
    </section>`;}
  return h;
}

// ===== Bracket =====
function renderBracket(){
  if(!T.built)return `<section class="card"><h2>Bracket</h2><p class="lead">Build the schedule first.</p><div><button class="btn primary" data-act="goSetup">Go to setup</button></div></section>`;
  let h=`<section class="card"><div class="row"><h2>Bracket</h2><span class="spacer"></span><label class="f" style="flex-direction:row;align-items:center;gap:8px">Age group<select id="fAge3"><option value="all">All</option>${T.ages.map(a=>`<option value="${a.id}" ${fAge===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label></div>
    <p class="lead">Every team makes the bracket, seeded from pool play. The higher seed is home. Top seeds get a bye when the team count isn't 4, 8 or 16. Enter scores here or on the schedule.</p></section>`;
  for(const a of T.ages){if(fAge!=='all'&&fAge!==a.id)continue;
    const bg=T.games.filter(g=>g.age===a.id&&g.phase==='bracket');if(!bg.length)continue;const R=bg[0].R;const N=named(a).length;const P=2**R;
    const seeded=!!(T.seeds||{})[a.id];const fin=bg.find(g=>g.round===R);const champ=fin?tWinner(T,fin):null;
    h+=`<section class="card"><div class="row"><h2>${esc(a.name)} bracket</h2>${seeded?'':'<span class="pill warn">Not seeded yet: finish pool play, then seed it on Pool standings</span>'}</div>
      ${champ?`<div class="champ"><span style="font-size:30px">🏆</span><div><div class="sub">${esc(a.name)} champion</div><div class="big">${esc(teamName(champ))}</div></div></div>`:''}
      ${P>N?`<p class="sub" style="margin:0">Byes: seed${P-N===1?'':'s'} 1${P-N>1?' to '+(P-N):''} skip the first round.</p>`:''}
      <div class="bracket">`;
    for(let r=1;r<=R;r++){const col=bg.filter(g=>g.round===r).sort((x,y)=>{const ix=+x.id.split('_').pop(),iy=+y.id.split('_').pop();return ix-iy;});
      const cards=r===1?Array.from({length:P/2},(_,k)=>col.find(g=>g.id===a.id+'_b1_'+k)||{bye:tSeedOrder(P).slice(2*k,2*k+2).find(x=>x<=N)}):col;
      h+=`<div class="bcol"><h4>${esc(tRoundName(col[0]||{R,round:r}))}</h4><div class="bslots">${cards.map(g=>{if(g.bye){const t=tSeedTeam(T,a.id,g.bye);return `<div class="bye">${t?esc(seedLabel(a.id,t)):'Seed '+g.bye} · bye</div>`;}const tt=gTeams(g);const ok=!tt.pending;const fin=tFinal(g)&&ok;const rr=fin?tRuns(T,g,tt.home,tt.away):null;const w=rr&&rr.h!==rr.a?(rr.h>rr.a?'h':'a'):'';
        const row=(side,label)=>`<div class="bteam ${w?(w===side?'win':'lose'):''}"><span class="s">${side==='h'&&ok?'H':''}</span><span class="nm ${ok?'':'ph'}">${esc(label)}</span>${ok?`<input type="number" min="0" inputmode="numeric" class="sc" id="bs_${g.id}_${side}" data-sc="${g.id}|${side}" value="${g.ff?(side==='a'?rr&&rr.a:rr&&rr.h):(side==='a'?(g.sa==null?'':g.sa):(g.sh==null?'':g.sh))}" ${g.ff?'disabled':''} aria-label="${esc(label)} runs, Game ${g.num}">`:'<span></span>'}</div>`;
        return `<div class="bgame"><div class="bh"><span>Game ${g.num}</span><span>${g.time!=null?tFmtTime(g.time):'Not placed'} · ${esc(fieldName(g.field))}</span></div>${row('a',tt.al)}${row('h',tt.hl)}</div>`;}).join('')}</div></div>`;}
    h+=`</div></section>`;}
  return h;
}

// ===== Save / open a tournament file =====
function slugify(x){return (String(x||'tournament').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'tournament');}
function downloadT(){try{const blob=new Blob([JSON.stringify({app:'gdx-tournament',v:1,saved:new Date().toISOString(),T})],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=slugify(T.name)+'.gdxt.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);toast('Tournament file saved to your downloads');}catch(e){toast('Couldn\'t save the file in this browser.');}}
function readTFile(f){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||o.app!=='gdx-tournament'||!o.T||!o.T.ages)throw 0;pendingFile=o;filePanel=true;render();window.scrollTo({top:0});}catch(e){toast('That file isn\'t a GameDay Express tournament file.');}};r.readAsText(f);}
function fileHtml(){if(!filePanel)return '';
  if(pendingFile){const x=pendingFile.T;return `<section class="card sharecard"><h2>Open ${esc(x.name||'this tournament')}?</h2><p class="lead">It has ${x.ages.length} age groups and ${(x.games||[]).length} games, with any scores entered. Opening it replaces the tournament saved in this browser.</p><div class="row"><button class="btn primary" data-act="fileOpenNow">Open this tournament</button><button class="btn" data-act="fileCancel">Cancel</button></div></section>`;}
  return `<section class="card sharecard"><h2>Save or open a tournament</h2><p class="lead">Your tournament is saved in this browser automatically. To move it to another computer or hand it to another director, save it as a file and send it. They open it here with <b>Open a tournament file</b>.</p>
    <div class="row"><button class="btn primary" data-act="fileSave">Save tournament file</button><label class="btn filebtn">Open a tournament file<input type="file" id="tFileIn" accept=".json,application/json"></label><button class="btn" data-act="newT">Start a new tournament</button><span class="spacer"></span><button class="btn link small" data-act="fileCancel">Close</button></div></section>`;}

// ===== Actions =====
function build(){const errs=setupErrors();if(errs.length){showErr=true;render();toast('A few things to fix first');return;}
  if(T.built&&!confirmBuild){confirmBuild=true;render();return;}
  const r=tSchedule(T);T.games=r.games;T.unplaced=r.unplaced;T.seeds={};T.tieOrder={};T.built=true;T.stale=false;confirmBuild=false;showErr=false;save();tab='schedule';render();window.scrollTo({top:0});
  toast(r.unplaced.length?`Built, but ${r.unplaced.length} games didn't fit`:`Built ${r.games.length} games`);}
function setCount(id,n){
  if(id==='nDays'){n=Math.max(1,Math.min(7,n));const D=T.days;
    while(D.length<n){const last=D[D.length-1];D.push({date:last&&last.date?tAddDays(last.date,1):'',from:480,to:1140,kind:'bracket'});if(D.length>1&&D[D.length-2].kind==='bracket')D[D.length-2].kind='pool';}
    while(D.length>n){D.pop();if(D.length&&!D.some(tBrDay))D[D.length-1].kind=D.length===1?'both':'bracket';}
    if(n===1&&D[0].kind!=='both')D[0].kind='both';touched();render();return;}
  if(id==='nAge'){n=Math.max(0,Math.min(12,n));while(T.ages.length<n)T.ages.push({id:newId('a'),name:'',poolGames:2,len:100,turn:20,teams:[],poolOf:{}});
    while(T.ages.length>n){const a=T.ages.pop();T.fields.forEach(f=>f.ages=f.ages.filter(x=>x!==a.id));}}
  else if(/^pg\d+$/.test(id)){const a=T.ages[+id.slice(2)];a.poolGames=Math.max(1,Math.min(4,n));a.nPools=0;a.poolOf={};}
  else if(/^nt\d+$/.test(id)){const a=T.ages[+id.slice(2)];n=Math.max(0,Math.min(32,n));while(a.teams.length<n)a.teams.push({id:newId('t'),name:'',org:''});a.teams.length=n;a.nPools=0;a.poolOf={};}
  else if(/^np\d+$/.test(id)){const a=T.ages[+id.slice(2)];a.nPools=Math.max(1,Math.min(Math.floor(named(a).length/2)||1,n));a.poolOf={};}
  else if(id==='nFld'){n=Math.max(0,Math.min(24,n));while(T.fields.length<n)T.fields.push({id:newId('f'),name:'Field '+(T.fields.length+1),ages:[]});T.fields.length=n;}
  touched();render();}
function tsv(){const rows=[['Game','Date','Time','Field','Age group','Round','Visitor','Home','Visitor runs','Home runs']];
  for(const g of T.games.slice().sort((a,b)=>a.num-b.num)){const tt=gTeams(g);const r=tFinal(g)&&!tt.pending?tRuns(T,g,tt.home,tt.away):null;
    rows.push([g.num,tFmtDate(g.date),g.time!=null?tFmtTime(g.time):'',fieldName(g.field),ageOf(g.age).name,roundLabel(g),tt.al,tt.hl,r?r.a:'',r?r.h:'']);}
  return rows.map(r=>r.join('\t')).join('\n');}

    for(const s of ['a','h']){const arr=g.ls[s];if(arr.some(v=>v!==''&&v!=null)){const sum=arr.reduce((p,c)=>p+(+c||0),0);if(s==='a')g.sa=sum;else g.sh=sum;}}
    if(!g.ls.a.some(v=>v!==''&&v!=null)&&!g.ls.h.some(v=>v!==''&&v!=null))delete g.ls;save();render();return;}

  if(a==='swapHome'){const g=T.games.find(x=>x.id===b.dataset.g);g.homeSide=g.homeSide==='b'?'a':'b';const t=g.sa;g.sa=g.sh;g.sh=t;save();render();return;}
  if(a==='retime'){const n=tRetimeBracket(T);save();render();toast(n?`${n} bracket game${n===1?'':'s'} still don't fit. Try a later last start or another day.`:'Bracket re-timed. Every bracket game fits.');return;}
  if(a==='lsMore'){const g=T.games.find(x=>x.id===b.dataset.g);g.ls=g.ls||{a:[],h:[]};const n=Math.max(7,g.ls.a.length,g.ls.h.length);g.ls.a[n]=g.ls.a[n]==null?'':g.ls.a[n];g.ls.h[n]=g.ls.h[n]==null?'':g.ls.h[n];render();return;}
  if(a==='mv'){mvOpen=mvOpen===b.dataset.g?null:b.dataset.g;render();return;}
  if(a==='copyTsv'){copyText(tsv()).then(ok=>{if(ok)toast('Schedule copied. Paste it into a sheet.');});return;}
  if(a==='flip'){const id=b.dataset.a;const grp=b.dataset.grp.split(',');const m=T.tieOrder[id]=(T.tieOrder[id]||[]);
    // place this team ahead of the other undecided teams in its group
    const decided=grp.filter(t=>m.includes(t));const insertAt=decided.length?Math.max(...decided.map(t=>m.indexOf(t)))+1:m.length;m.splice(insertAt,0,b.dataset.t);
    const left=grp.filter(t=>!m.includes(t));if(left.length===1)m.splice(m.indexOf(b.dataset.t)+1,0,left[0]);save();render();return;}
  if(a==='flipReset'){const id=b.dataset.a;const grp=b.dataset.grp.split(',');T.tieOrder[id]=(T.tieOrder[id]||[]).filter(t=>!grp.includes(t));save();render();return;}
  if(a==='seed'){const id=b.dataset.a;const pg=T.games.filter(g=>g.age===id&&g.phase==='pool');const open=pg.filter(g=>!tFinal(g)).length;
    if(open&&confirmSeed!==id){confirmSeed=id;render();return;}
    const {fix}=seededOrderFor(id);T.seeds[id]={order:fix.order,notes:fix.notes,at:Date.now()};confirmSeed=null;save();render();toast(`${ageOf(id).name} bracket seeded`);return;}
  if(a==='unseed'){delete T.seeds[b.dataset.a];save();render();return;}
  if(a==='fileSave'){downloadT();return;}
  if(a==='fileCancel'){filePanel=false;pendingFile=null;render();return;}
  if(a==='fileOpenNow'){T=Object.assign(blankT(),pendingFile.T);if(!pendingFile.T.days)T.days=null;tDays(T);tRules(T);pendingFile=null;filePanel=false;save();tab=T.built?'schedule':'setup';render();toast('Opened '+(T.name||'tournament'));return;}
  if(a==='newT'){if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Click again: this clears the current tournament';return;}T=blankT();filePanel=false;tab='setup';save();render();return;}
});
if(!load())T=blankT();
tab=T.built?'schedule':'setup';
render();
</script>
